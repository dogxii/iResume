<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iResume 3.0 原型 · 方案 C「向导」</title>
<style>
/* ===================================================================
   共用骨架：布局 / 组件结构 / 移动端 / 简历产物样式
   主题文件只负责 token 与风格化细节
   =================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: #c9cdd3;
  -webkit-font-smoothing: antialiased;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
.i {
  flex: none;
  display: block;
}
kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  line-height: 1;
  padding: 3px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
}

/* ---------------- 原型控制条（不属于设计） ---------------- */
.proto-bar {
  position: fixed;
  inset: 0 0 auto 0;
  height: 42px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: #0b0b0c;
  color: #9a9a9f;
  font: 12px/1 -apple-system, "PingFang SC", system-ui, sans-serif;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.proto-bar strong {
  color: #fff;
  font-weight: 600;
}
.pb-dir {
  color: #fff;
  background: #2a2a2e;
  padding: 5px 9px;
  border-radius: 6px;
}
.pb-group {
  display: flex;
  gap: 2px;
  background: #1c1c1f;
  padding: 3px;
  border-radius: 8px;
}
.pb-group a,
.pb-group button {
  color: #b6b6bb;
  background: none;
  border: 0;
  padding: 6px 10px;
  border-radius: 6px;
  text-decoration: none;
  font: inherit;
}
.pb-group .is-on {
  background: #fff;
  color: #0b0b0c;
}
.pb-spacer {
  flex: 1;
}
.stage {
  position: fixed;
  inset: 42px 0 0 0;
  display: grid;
  place-items: center;
}
.stage #app {
  width: 100%;
  height: 100%;
}
.stage.is-mobile #app {
  width: 390px;
  height: min(844px, calc(100% - 36px));
  border-radius: 38px;
  box-shadow:
    0 0 0 11px #111,
    0 30px 80px rgb(0 0 0 / 0.35);
}
.real-phone .stage.is-mobile #app {
  width: 100%;
  height: 100%;
  border-radius: 0;
  box-shadow: none;
}

/* ---------------- App 根 ---------------- */
.app {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs);
  line-height: 1.5;
}
.muted {
  color: var(--text-3);
  margin: 2px 0 8px;
  font-size: 0.88em;
}

/* ---------------- 基础组件 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--ctl-h);
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s,
    box-shadow 0.15s;
}
.btn:hover {
  background: var(--surface-2);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-2);
}
.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}
.btn-sm {
  height: calc(var(--ctl-h) - 8px);
  padding: 0 10px;
  font-size: 0.9em;
}
.btn-danger {
  color: var(--danger);
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: var(--ctl-h);
  height: var(--ctl-h);
  border-radius: var(--radius-sm);
  border: 0;
  background: transparent;
  color: var(--text-2);
  transition: background 0.15s;
}
.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
  color: var(--text);
}
.icon-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
:where(button, a, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 0.92em;
}

.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: calc(var(--ctl-h) - 10px);
  padding: 0 12px;
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: var(--text-2);
  font-weight: 500;
}
.seg button.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field.wide {
  grid-column: 1 / -1;
}
.f-label,
.field > span:first-child {
  font-size: 0.86em;
  font-weight: 500;
  color: var(--text-2);
}
.field input,
.field textarea,
.search input {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  padding: 8px 10px;
  outline: none;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
.field input {
  height: var(--ctl-h);
}
.field textarea {
  resize: vertical;
  line-height: 1.65;
}
.field input:focus,
.field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.f-hint {
  color: var(--text-3);
  font-size: 0.82em;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
}
.field-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.field-row .field {
  flex: 1;
}

.toggle {
  appearance: none;
  width: 36px;
  height: 20px;
  border-radius: 999px;
  background: var(--border-strong);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  margin: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
  transition: transform 0.2s;
}
.toggle:checked {
  background: var(--accent);
}
.toggle:checked::after {
  transform: translateX(16px);
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 28px;
  z-index: 80;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border-radius: var(--radius);
  background: var(--toast-bg, #1f2328);
  color: #fff;
  font-size: 13px;
  box-shadow: var(--shadow);
  transition:
    opacity 0.2s,
    transform 0.2s;
}
.toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.menu-wrap,
.doc-meta-wrap {
  position: relative;
}
.menu,
.popover {
  position: absolute;
  top: calc(100% + 8px);
  z-index: 50;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  animation: pop 0.14s ease-out;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
}
.menu {
  right: 0;
  width: 248px;
  padding: 6px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
  color: var(--text-2);
}
.menu-item span {
  display: flex;
  flex-direction: column;
}
.menu-item strong {
  color: var(--text);
  font-weight: 500;
}
.menu-item small {
  color: var(--text-3);
  font-size: 12px;
}
.menu-item:hover {
  background: var(--surface-2);
}
.popover {
  left: 0;
  width: 300px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ---------------- 首页 ---------------- */
.home {
  height: 100%;
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
}
.home-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 14px;
  border-right: 1px solid var(--border);
  background: var(--nav-bg, var(--surface));
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 18px;
}
.logo {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 700;
  font-family: var(--font-display);
}
.brand-name {
  font-weight: 700;
  font-size: 17px;
  font-family: var(--font-display);
}
.brand-sub {
  color: var(--text-3);
  font-size: 12px;
}
.nav-items {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  text-decoration: none;
  font-weight: 500;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.is-active {
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.nav-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  color: var(--text-3);
  font-size: 12px;
}
.sync-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.home-main {
  overflow: auto;
  min-height: 0;
}
.home-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--page-pad);
  display: flex;
  flex-direction: column;
  gap: 44px;
}
.home-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.home-head h1 {
  margin: 4px 0 6px;
  font-family: var(--font-display);
  font-size: var(--h1);
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.eyebrow {
  margin: 0;
  color: var(--text-3);
  font-size: 13px;
}
.lead {
  margin: 0;
  color: var(--text-2);
  max-width: 46ch;
}
.home-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.search {
  position: relative;
  display: flex;
  align-items: center;
  color: var(--text-3);
}
.search .i {
  position: absolute;
  left: 10px;
}
.search input {
  height: var(--ctl-h);
  width: 240px;
  padding-left: 34px;
}
.search-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--ctl-h);
  width: 300px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text-3);
  text-align: left;
}
.search-trigger span {
  flex: 1;
}
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.sec-head h2 {
  margin: 0;
  font-size: var(--h2);
  font-family: var(--font-display);
  display: flex;
  align-items: center;
  gap: 8px;
}
.count {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 2px 8px;
}
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip-btn {
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: 13px;
}
.chip-btn.is-active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

.doc-grid,
.tpl-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
  gap: 20px;
}
.doc-card,
.tpl-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  cursor: pointer;
}
.doc-thumb {
  position: relative;
  overflow: hidden;
  aspect-ratio: 210 / 297;
  background: #fff;
  border-radius: var(--thumb-radius, var(--radius-sm));
}
.js-scale {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  transform-origin: 0 0;
  pointer-events: none;
}
.doc-info {
  padding: 12px 2px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.doc-info h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.doc-meta {
  margin: 0;
  display: flex;
  gap: 10px;
  color: var(--text-3);
  font-size: 12px;
}
.doc-more {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  opacity: 0;
}
.doc-card:hover .doc-more,
.doc-card:focus-within .doc-more {
  opacity: 1;
}
.doc-badge {
  position: absolute;
  bottom: 10px;
  left: 10px;
  box-shadow: var(--shadow-sm);
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 11px;
  font-weight: 600;
}
.tpl-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 2px 0;
}
.start-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.start-tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 18px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-3);
  font-size: 13px;
  transition:
    border-color 0.15s,
    transform 0.15s,
    box-shadow 0.15s;
}
.start-tile:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
}
.start-tile strong {
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}
.st-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  margin-bottom: 8px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.mnav {
  display: none;
}

/* progress card (C) */
.progress-card {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 24px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.pc-ring {
  position: relative;
  display: grid;
  place-items: center;
}
.pc-ring strong {
  position: absolute;
  font-size: 22px;
}
.pc-ring small {
  font-size: 12px;
}
.pc-body {
  flex: 1;
  min-width: 0;
}
.pc-body h2 {
  margin: 0 0 4px;
  font-size: 18px;
}
.pc-body p {
  margin: 0 0 10px;
  color: var(--text-2);
}
.pc-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pc-steps button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  text-align: left;
  font-size: 13px;
}
.pc-steps button span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pc-steps button:hover {
  color: var(--text);
}
.ring-track {
  fill: none;
  stroke: var(--surface-2);
  stroke-width: 5;
}
.ring-bar {
  fill: none;
  stroke: var(--accent);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s;
}

/* ---------------- 编辑器 ---------------- */
.ed {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  height: var(--topbar-h);
  padding: 0 12px;
  background: var(--topbar-bg, var(--surface));
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 20;
}
.tb-left,
.tb-right {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tb-right {
  justify-content: flex-end;
}
.doc-meta-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.doc-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  height: var(--ctl-h);
  padding: 0 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  font-weight: 600;
}
.doc-title:hover {
  background: var(--surface-2);
}
.dt-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ver {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-2);
}
.save-state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-3);
  font-size: 12px;
  white-space: nowrap;
}
.save-state .i {
  color: var(--success);
}
.dot-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warning);
  animation: pulse 0.9s infinite alternate;
}
@keyframes pulse {
  to {
    opacity: 0.3;
  }
}
.kbd-btn kbd {
  margin-left: 2px;
}
.tb-progress {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-right: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-progress .ring-track,
.tb-progress .ring-bar {
  stroke-width: 4;
}

.ed-body {
  display: grid;
  grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
  gap: var(--ed-gap);
  padding: var(--ed-gap);
  min-height: 0;
  background: var(--desk);
}
.panel {
  min-height: 0;
  overflow: auto;
  background: var(--surface);
  scrollbar-width: thin;
}
.panel-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.panel-head h3 {
  margin: 0;
  flex: 1;
  font-size: 1em;
  font-weight: 600;
}
.ph-sub {
  color: var(--text-3);
  font-size: 12px;
}
.ph-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.title-input {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 8px;
  margin-left: -4px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  font-weight: 600;
  outline: none;
}
.title-input:hover {
  border-color: var(--border);
}
.title-input:focus {
  border-color: var(--accent);
  background: var(--input-bg);
}
.insp-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* outline */
.outline {
  list-style: none;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.ol-item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 6px 0 4px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
}
.ol-item:hover {
  background: var(--surface-2);
}
.ol-item.is-active {
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.ol-item.is-hidden .ol-title,
.ol-item.is-hidden .ol-icon {
  opacity: 0.45;
}
.ol-item.is-dragging {
  opacity: 0.4;
}
.ol-item.drop-target {
  border-color: var(--accent);
  border-style: dashed;
}
.ol-grip {
  width: 14px;
  color: var(--text-3);
  opacity: 0;
  cursor: grab;
}
.ol-item:hover .ol-grip {
  opacity: 1;
}
.ol-title {
  flex: 1;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ol-count {
  font-size: 12px;
  color: var(--text-3);
}
.ol-tips {
  display: grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 11px;
  font-weight: 600;
}
.ol-done {
  display: none;
}
.ol-eye {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text-3);
  opacity: 0;
}
.ol-item:hover .ol-eye,
.ol-item.is-hidden .ol-eye {
  opacity: 1;
}
.ol-eye:hover {
  background: var(--surface);
  color: var(--text);
}
.add-section,
.add-entry {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--ctl-h);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-2);
  font-weight: 500;
}
.add-section {
  margin: 4px 14px 14px;
  width: calc(100% - 28px);
}
.add-section:hover,
.add-entry:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.outline-foot p {
  display: flex;
  gap: 8px;
  margin: 0 14px 14px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12.5px;
}

/* canvas */
.ed-canvas {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--desk);
  border-radius: var(--canvas-radius, 0);
}
.canvas-tools {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}
.zoom {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.zoom .icon-btn {
  width: 28px;
  height: 28px;
}
.zoom-val {
  min-width: 46px;
  text-align: center;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
}
.canvas-scroll {
  flex: 1;
  overflow: auto;
  padding: 64px 36px 96px;
  scrollbar-width: thin;
}
.sheet-wrap {
  position: relative;
  margin: 0 auto;
}
.sheet {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  transform-origin: 0 0;
  box-shadow: var(--paper-shadow);
}
.page-break {
  position: absolute;
  left: -28px;
  right: -28px;
  height: 0;
  border-top: 2px dashed var(--danger);
  pointer-events: none;
}
.page-break span {
  position: absolute;
  right: 28px;
  top: -24px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--danger);
  color: #fff;
  font: 600 12px/1.4 var(--font-ui);
}
.fit-chip {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  color: var(--text-2);
  font-size: 13px;
  white-space: nowrap;
}
.fit-chip.is-ok {
  padding-right: 14px;
}
.fit-chip.is-ok .i {
  color: var(--success);
}
.fit-chip.is-over .i:first-child {
  color: var(--danger);
}
.fit-chip b {
  color: var(--text);
}
.fit-chip .btn {
  border-radius: 999px;
}

/* inspector */
.photo-row {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface-2);
}
.photo-row p {
  margin: 2px 0 8px;
}
.photo {
  display: grid;
  place-items: center;
  width: 64px;
  height: 80px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  color: var(--text-3);
}
.entries {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: box-shadow 0.15s;
}
.entry-card.is-open {
  box-shadow: var(--shadow-sm);
}
.entry-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px 10px 6px;
  border: 0;
  background: none;
  text-align: left;
  color: var(--text-3);
}
.entry-head > .i:last-child {
  transition: transform 0.15s;
}
.entry-card.is-open .entry-head > .i:last-child {
  transform: rotate(180deg);
}
.eh-grip {
  color: var(--text-3);
  opacity: 0.6;
}
.eh-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.eh-text strong {
  color: var(--text);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eh-text small {
  font-size: 12px;
}
.eh-tips {
  display: grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 11px;
  font-weight: 600;
}
.entry-body {
  padding: 4px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.entry-actions {
  display: flex;
  justify-content: space-between;
}
.tips {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tips:empty {
  display: none;
}
.tip {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text-2);
  background: var(--surface-2);
}
.tip .i {
  margin-top: 2px;
}
.tip-warn .i {
  color: var(--warning);
}
.tip-info .i {
  color: var(--accent);
}
.coach {
  padding: 14px;
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--text-2);
  font-size: 13px;
}
.coach-head {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent-text, var(--accent));
  margin-bottom: 6px;
}
.coach p {
  margin: 0;
  line-height: 1.7;
}

/* design panel */
.group h4 {
  margin: 0 0 10px;
  font-size: 0.86em;
  font-weight: 600;
  color: var(--text-2);
}
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tpl-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--text-2);
}
.tpl-card .doc-thumb {
  aspect-ratio: 4 / 3;
  border: 1px solid var(--border);
}
.tpl-card.is-active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
  color: var(--accent-text, var(--accent));
  font-weight: 600;
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0;
  background: var(--c);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1);
}
.swatch.is-active {
  box-shadow:
    0 0 0 2px var(--surface),
    0 0 0 4px var(--c);
}
.swatch.custom {
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  border: 1px dashed var(--border-strong);
  box-shadow: none;
}
.swatch.custom input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.design .seg {
  display: flex;
}
.design .seg button {
  flex: 1;
  justify-content: center;
}
.slider-row {
  display: grid;
  grid-template-columns: 64px 1fr 48px;
  align-items: center;
  gap: 10px;
  min-height: 34px;
  font-size: 13px;
  color: var(--text-2);
}
.slider-row output {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-size: 12px;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  font-size: 13px;
  color: var(--text-2);
}

/* status bar (B) */
.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 26px;
  padding: 0 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-3);
  font-size: 11.5px;
}
.statusbar span,
.sb-issues {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.sb-issues {
  border: 0;
  background: none;
  color: var(--warning);
  font-size: inherit;
  padding: 0;
}
.sb-spacer {
  flex: 1;
}
.statusbar kbd {
  padding: 1px 4px;
  font-size: 10px;
}

/* palette (B) */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 90;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 12vh;
  background: rgb(0 0 0 / 0.45);
  backdrop-filter: blur(2px);
  animation: pop 0.12s;
}
.palette {
  width: min(560px, calc(100% - 32px));
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.pal-input {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  color: var(--text-3);
}
.pal-input input {
  flex: 1;
  border: 0;
  background: none;
  outline: none;
  font-size: 15px;
  color: var(--text);
}
.pal-list {
  max-height: 360px;
  overflow: auto;
  padding: 6px;
}
.pal-group {
  padding: 8px 10px 4px;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.pal-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 38px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
  color: var(--text-2);
}
.pal-item span {
  flex: 1;
}
.pal-item.is-active {
  background: var(--accent-soft);
  color: var(--text);
}
.pal-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-3);
}

.mtabs {
  display: none;
}

/* ===================================================================
   移动端（.device-mobile）
   =================================================================== */
.device-mobile {
  --ctl-h: 40px;
}
.device-mobile .home {
  grid-template-columns: 1fr;
  grid-template-rows: minmax(0, 1fr) auto;
}
.device-mobile .home-nav {
  display: none;
}
.device-mobile .home-inner {
  padding: 28px 18px 32px;
  gap: 32px;
}
.device-mobile .home-head h1 {
  font-size: 26px;
}
.device-mobile .home-actions {
  width: 100%;
}
.device-mobile .home-actions .btn-primary {
  display: none;
}
.device-mobile .search,
.device-mobile .search input,
.device-mobile .search-trigger {
  width: 100%;
}
.device-mobile .doc-grid,
.device-mobile .tpl-strip {
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.device-mobile .start-grid {
  grid-template-columns: 1fr 1fr;
}
.device-mobile .start-tile {
  padding: 14px;
}
.device-mobile .start-tile > span:last-child {
  display: none;
}
.device-mobile .progress-card {
  flex-direction: column;
  align-items: stretch;
  text-align: left;
}
.device-mobile .pc-ring {
  display: none;
}
.device-mobile .mnav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding: 0 8px 8px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.mnav button,
.mtabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 56px;
  border: 0;
  background: none;
  color: var(--text-3);
  font-size: 11px;
}
.mnav button.is-active,
.mtabs button.is-active {
  color: var(--accent-text, var(--accent));
}
.mnav .mnav-fab {
  width: 48px;
  min-width: 48px;
  height: 48px;
  border-radius: 16px;
  justify-content: center;
  background: var(--accent);
  color: var(--accent-fg);
  box-shadow: var(--shadow);
}

.device-mobile .topbar {
  grid-template-columns: 1fr auto;
  height: 56px;
  padding: 0 8px;
}
.device-mobile .tb-center,
.device-mobile .save-state,
.device-mobile .kbd-btn,
.device-mobile [data-action="redo"],
.device-mobile .tb-progress,
.device-mobile .ver {
  display: none;
}
.device-mobile [data-action="export"] span,
.device-mobile [data-action="export"] .i:last-child {
  display: none;
}
.device-mobile [data-action="export"] {
  width: 40px;
  padding: 0;
}
.device-mobile .ed {
  grid-template-rows: auto minmax(0, 1fr) auto auto;
}
.device-mobile .ed-body {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  padding: 0;
  gap: 0;
}
.device-mobile .ed-left,
.device-mobile .ed-right,
.device-mobile .ed-canvas {
  display: none;
  border-radius: 0;
  box-shadow: none;
  border: 0;
}
.device-mobile .statusbar {
  display: none;
}
.device-mobile[data-mtab="edit"] .ed-left {
  display: block;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.device-mobile[data-mtab="edit"] .ed-left > :not(#outline),
.device-mobile[data-mtab="edit"] #outline > :not(.outline) {
  display: none;
}
.device-mobile .outline {
  flex-direction: row;
  overflow-x: auto;
  gap: 6px;
  padding: 10px 12px;
  scrollbar-width: none;
}
.device-mobile .ol-item {
  flex: none;
  min-height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.device-mobile .ol-item.is-active {
  border-color: transparent;
}
.device-mobile .ol-grip,
.device-mobile .ol-eye,
.device-mobile .ol-count,
.device-mobile .ol-done,
.device-mobile .ol-icon {
  display: none !important;
}
.device-mobile .ol-item::before {
  display: none !important;
}
.device-mobile[data-mtab="edit"] .ed-right,
.device-mobile[data-mtab="design"] .ed-right {
  display: block;
}
.device-mobile[data-mtab="design"] .ed-body {
  grid-template-rows: minmax(0, 1fr);
}
.device-mobile[data-mtab="preview"] .ed-canvas {
  display: flex;
}
.device-mobile[data-mtab="preview"] .ed-body {
  grid-template-rows: minmax(0, 1fr);
}
.device-mobile .canvas-scroll {
  padding: 16px 12px 88px;
}
.device-mobile .canvas-tools {
  display: none;
}
.device-mobile .fit-chip {
  bottom: 14px;
  max-width: calc(100% - 24px);
}
.device-mobile .fields {
  grid-template-columns: 1fr;
}
.device-mobile .tpl-grid {
  grid-template-columns: repeat(2, 1fr);
}
.device-mobile .mtabs {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 64px;
  padding-bottom: 6px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.device-mobile .menu {
  position: fixed;
  top: auto;
  left: 8px;
  right: 8px;
  bottom: 8px;
  width: auto;
}
.device-mobile .popover {
  width: calc(100vw - 60px);
  max-width: 340px;
}
.device-mobile .canvas-scroll {
  overflow-x: hidden;
}

/* ===================================================================
   简历产物（独立 token：--rs-*，与 App 主题无关）
   =================================================================== */
.rs-page {
  position: relative;
  width: 794px;
  min-height: 1123px;
  padding: var(--rs-margin);
  background: #fff;
  color: #1f2328;
  font-family: var(--rs-font);
  font-size: var(--rs-size);
  line-height: var(--rs-lh);
  text-align: left;
}
.rs-page ul {
  margin: 0.15em 0 0;
  padding-left: 1.2em;
}
.rs-page li {
  margin: 0.08em 0;
}
.rs-page li::marker {
  color: color-mix(in srgb, var(--rs-accent) 70%, #999);
}
.rs-page p {
  margin: 0.15em 0;
}
.rs-page strong {
  font-weight: 600;
  color: #111;
}
.rs-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: calc(var(--rs-gap) * 1.1);
}
.rs-head h1 {
  margin: 0;
  font-size: 2.05em;
  line-height: 1.15;
  font-weight: 700;
  color: #111;
  letter-spacing: 0.02em;
}
.rs-title {
  margin-top: 0.25em;
  color: var(--rs-accent);
  font-weight: 500;
  font-size: 1.05em;
}
.rs-contacts {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: auto auto;
  gap: 0.15em 1.4em;
  font-size: 0.86em;
  color: #4b5563;
}
.rs-page .rs-contacts li {
  display: flex;
  align-items: center;
  gap: 0.45em;
  margin: 0;
}
.rs-contacts .i {
  color: var(--rs-accent);
  width: 1.05em;
  height: 1.05em;
}
.rs-section {
  margin-top: var(--rs-gap);
}
.rs-h {
  display: flex;
  align-items: center;
  gap: 0.45em;
  margin: 0 0 0.5em;
  padding-bottom: 0.3em;
  font-size: 1.12em;
  font-weight: 700;
  color: #111;
  border-bottom: 1px solid #e5e7eb;
}
.rs-h .i {
  color: var(--rs-accent);
}
.rs-entry + .rs-entry {
  margin-top: 0.7em;
}
.rs-entry-head {
  display: flex;
  align-items: baseline;
  gap: 0.8em;
}
.rs-entry-head strong {
  font-weight: 650;
}
.rs-sub {
  color: #4b5563;
}
.rs-date {
  margin-left: auto;
  color: #6b7280;
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.rs-tags {

}

  font-size: 2.3em;
  letter-spacing: 0.12em;
  font-weight: 600;
}

  flex-wrap: wrap;
  justify-content: center;
  gap: 0.2em 1.1em;
}
.tpl-center .rs-h {
  justify-content: center;
  border: 0;
  color: var(--rs-accent);
  font-size: 1em;
  letter-spacing: 0.2em;
  gap: 0.8em;
}
.tpl-center .rs-h::before,
.tpl-center .rs-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}

/* 模板：深色页眉 */
.tpl-banner .rs-head {
  margin: calc(var(--rs-margin) * -1) calc(var(--rs-margin) * -1) var(--rs-gap);
  padding: calc(var(--rs-margin) * 0.8) var(--rs-margin);
  background: color-mix(in srgb, var(--rs-accent) 22%, #0f1115);
  color: #fff;
  align-items: center;
}
.tpl-banner .rs-head h1 {
  color: #fff;
}
.tpl-banner .rs-title {
  color: color-mix(in srgb, var(--rs-accent) 40%, #fff);
}
.tpl-banner .rs-contacts {
  color: rgb(255 255 255 / 0.82);
}
.tpl-banner .rs-contacts .i {
  color: color-mix(in srgb, var(--rs-accent) 40%, #fff);
}
.tpl-banner .rs-h {
  border: 0;
  padding: 0 0 0 0.6em;
  border-left: 4px solid var(--rs-accent);
  line-height: 1.2;
}
.tpl-banner .is-interactive.rs-head {
  outline-offset: -4px;
}

/* 模板：书卷 */
.tpl-serif {

.tpl-serif .rs-head {

}
.tpl-serif .rs-title {

.theme-c .logo {

.theme-c .brand-sub {

}
.theme-c .brand {

}
.theme-c .brand-sub {
  padding-left: 38px;

.theme-c .nav-item {
  padding: 11px 12px;

}
.theme-c .btn {

.theme-c .doc-card,

.theme-c .doc-card:hover,

.theme-c .doc-thumb {

.theme-c .tag {

}
.theme-c .st-icon {

.theme-c .tpl-card {
  border-radius: 14px;

  box-shadow: var(--shadow);

    let list = []
    const flush = () => {
      if (list.length) html += `<ul>${list.map((l) => `<li>${inline(l)}</li>`).join('')}</ul>`
      list = []
    }
    for (const line of lines) {
      if (/^[-*]\s+/.test(line)) list.push(line.replace(/^[-*]\s+/, ''))
      else {
        flush()
        html += `<p>${inline(line)}</p>`
      }
    }
    flush()
    return html
  }

        return wrap(s.id, title + content)

  // ---------------------------------------------------------------- EDITOR
  function renderTopbar() {
    const score = completeness()
    if (floating()) return renderSideHead()
    return `<header class="topbar">
      <div class="tb-left">
        <button type="button" class="icon-btn" data-go="home" aria-label="返回我的简历" title="返回我的简历">${icon('arrowLeft', 18)}</button>
        <div class="doc-meta-wrap">
          <button type="button" class="doc-title" data-action="meta"><span class="dt-name">${esc(state.doc.name)}</span><span class="ver">v${esc(state.doc.version)}</span>${icon('chevDown', 14)}</button>
          <span class="save-state" id="save-state">${saveLabel()}</span>
          ${state.metaOpen ? renderMetaPopover() : ''}
        </div>
      </div>
      <div class="tb-center">${seg(
        [
          ['content', `${icon('pen', 15)}<span>内容</span>`],
          ['design', `${icon('palette', 15)}<span>设计</span>`],

        state.mode,
        'data-mode'

      <div class="tb-right">

        ${F.palette ? `<button type="button" class="btn btn-ghost kbd-btn" data-action="palette">${icon('command', 15)}<span>命令</span><kbd>⌘K</kbd></button>` : ''}
        <button type="button" class="icon-btn" data-action="undo" aria-label="撤销" title="撤销 ⌘Z" ${undoStack.length ? '' : 'disabled'}>${icon('undo', 18)}</button>
        <button type="button" class="icon-btn" data-action="redo" aria-label="重做" title="重做 ⇧⌘Z" ${redoStack.length ? '' : 'disabled'}>${icon('redo', 18)}</button>
        ${F.darkToggle ? `<button type="button" class="icon-btn" data-action="theme" aria-label="切换主题">${icon(state.theme === 'dark' ? 'sun' : 'moon', 18)}</button>` : ''}
        <div class="menu-wrap">
          <button type="button" class="btn btn-primary" data-action="export">${icon('download', 16)}<span>导出</span>${icon('chevDown', 14)}</button>
          ${
            state.exportOpen
              ? `<div class="menu" role="menu">
              ${[
                ['file', 'PDF 文档', '投递首选，矢量清晰', 'PDF'],
                ['eyeView', 'PNG 图片', '适合发微信 / 预览', 'PNG'],
                ['download', 'JSON 备份', '可再次导入编辑', 'JSON'],
                ['note', 'Markdown', '纯文本，方便粘贴', 'Markdown'],
              ]
                .map(
                  ([ic, t, d, k]) =>
                    `<button type="button" role="menuitem" class="menu-item" data-export="${k}">${icon(ic, 16)}<span><strong>${t}</strong><small>${d}</small></span></button>`
                )
                .join('')}
            </div>`
              : ''
          }
        </div>
      </div>
    </header>`
  }

  function exportMenu() {
    return state.exportOpen
      ? `<div class="menu" role="menu">${[
          ['file', 'PDF 文档', '投递首选，矢量清晰', 'PDF'],
          ['eyeView', 'PNG 图片', '适合发微信 / 预览', 'PNG'],
          ['download', 'JSON 备份', '可再次导入编辑', 'JSON'],
          ['note', 'Markdown', '纯文本，方便粘贴', 'Markdown'],
        ]
          .map(
            ([ic, t, d, k]) =>
              `<button type="button" role="menuitem" class="menu-item" data-export="${k}">${icon(ic, 16)}<span><strong>${t}</strong><small>${d}</small></span></button>`
          )
          .join('')}</div>`
      : ''
  }

  function renderSideHead() {
    return `<header class="topbar side-head">
      <div class="sh-row">
        <button type="button" class="brand-btn" data-go="home" title="返回我的简历"><span class="logo">i</span><span class="brand-name">Resume</span></button>
        <span class="sb-spacer"></span>
        <span class="save-state" id="save-state">${saveLabel()}</span>
      </div>
      <div class="doc-meta-wrap">
        <button type="button" class="doc-title" data-action="meta"><span class="dt-name">${esc(state.doc.name)}</span><span class="ver">v${esc(state.doc.version)}</span>${icon('chevDown', 14)}</button>
        ${state.metaOpen ? renderMetaPopover() : ''}
      </div>
      <div class="sh-row sh-tools">
        <button type="button" class="icon-btn" data-action="undo" aria-label="撤销" title="撤销 ⌘Z" ${undoStack.length ? '' : 'disabled'}>${icon('undo', 17)}</button>
        <button type="button" class="icon-btn" data-action="redo" aria-label="重做" title="重做 ⇧⌘Z" ${redoStack.length ? '' : 'disabled'}>${icon('redo', 17)}</button>
        <button type="button" class="icon-btn" data-toast="版本历史：对比差异 / 回滚" aria-label="版本历史" title="版本历史">${icon('history', 17)}</button>
        <button type="button" class="icon-btn" data-toast="导入：JSON 备份 / 粘贴文本" aria-label="导入" title="导入">${icon('upload', 17)}</button>

          ${exportMenu()}
        </div>
      </div>
    </header>`
  }

  function saveLabel() {
    return state.saved
      ? `${icon('check', 13)}<span>已保存到本地</span>`
      : `<span class="dot-pulse"></span><span>保存中…</span>`
  }

  function renderMetaPopover() {
    return `<div class="popover meta-pop" role="dialog" aria-label="简历信息">
      <label class="field"><span>简历名称</span><input data-bind="meta:name" value="${esc(state.doc.name)}" /></label>
      <div class="field-row">
        <label class="field"><span>版本</span><input data-bind="meta:version" value="${esc(state.doc.version)}" /></label>
        ${btn(`${icon('history', 15)}<span>历史版本</span>`, 'data-toast="打开版本历史（对比 / 回滚）"', 'btn btn-ghost')}
      </div>
      <label class="field"><span>标签</span><input data-bind="meta:tags" value="${esc(state.doc.tags.join('，'))}" placeholder="用逗号分隔" /></label>
    </div>`
  }

  function renderOutline() {
    const items = [
      { id: 'personal', icon: 'user', title: '个人信息', visible: true, fixed: true, count: '', filled: true },
      ...state.doc.sections.map((s) => ({
        id: s.id,
        icon: s.icon,
        title: s.title,
        visible: s.visible,
        count: s.kind === 'entries' ? s.items.length : '',
        filled: sectionFilled(s),
        tips: s.kind === 'entries' ? s.items.flatMap((it) => entryTips(s.id, it)).length : 0,
      })),
    ]
    return `<div class="panel-head"><h3>${P.copy.outline}</h3><span class="ph-sub">拖动调整顺序</span></div>
      <ol class="outline">
        ${items
          .map(
            (it) => `<li class="ol-item${state.selected === it.id ? ' is-active' : ''}${it.visible ? '' : ' is-hidden'}" data-select="${it.id}" ${it.fixed ? '' : `draggable="true" data-drag="${it.id}"`}>
              <span class="ol-grip">${it.fixed ? '' : icon('grip', 14)}</span>
              <span class="ol-icon">${icon(it.icon, 16)}</span>
              <span class="ol-title">${esc(it.title)}</span>
              ${it.tips ? `<span class="ol-tips" title="${it.tips} 条建议">${it.tips}</span>` : ''}
              ${it.count !== '' ? `<span class="ol-count">${it.count}</span>` : ''}
              <span class="ol-done">${it.filled ? icon('check', 12) : ''}</span>
              ${it.fixed ? '' : `<button type="button" class="ol-eye" data-togglevis="${it.id}" aria-label="${it.visible ? '隐藏' : '显示'}区块">${icon(it.visible ? 'eye' : 'eyeOff', 15)}</button>`}
            </li>`
          )
          .join('')}
      </ol>
      <button type="button" class="add-section" data-toast="可添加：校园经历 / 证书 / 语言能力 / 自定义区块">${icon('plus', 15)}<span>添加区块</span></button>
      ${
        F.coach
          ? `<div class="outline-foot"><p>${icon('bulb', 15)}<span>小提示：点击右侧简历上的任意区块，就能直接编辑它。</span></p></div>`
          : ''
      }`
  }

  function renderCanvas() {
    return `<div class="canvas-tools">
        <div class="zoom">
          <button type="button" class="icon-btn" data-zoom="-" aria-label="缩小">${icon('minus', 15)}</button>
          <span class="zoom-val" id="zoom-val">100%</span>
          <button type="button" class="icon-btn" data-zoom="+" aria-label="放大">${icon('plus', 15)}</button>
          <button type="button" class="icon-btn" data-zoom="fit" aria-label="适应宽度" title="适应宽度">${icon('maximize', 15)}</button>
          ${F.pageMode ? `<span class="zoom-sep"></span><button type="button" class="icon-btn is-on" data-toast="连续预览" aria-label="连续预览" title="连续预览">${icon('file', 15)}</button><button type="button" class="icon-btn" data-toast="分页预览：每页独立显示，所见即所得" aria-label="分页预览" title="分页预览">${icon('clipboard', 15)}</button>` : ''}
        </div>
      </div>
      <div class="canvas-scroll" id="canvas-scroll"><div class="sheet-wrap" id="sheet-wrap"><div class="sheet" id="sheet"></div></div></div>
      <div class="fit-chip" id="fit-chip"></div>`
  }

  function field(label, bind, value, opts = {}) {
    const input = opts.textarea
      ? `<textarea data-bind="${bind}" rows="${opts.rows || 5}" placeholder="${esc(opts.placeholder || '')}">${esc(value)}</textarea>`
      : `<input data-bind="${bind}" value="${esc(value)}" placeholder="${esc(opts.placeholder || '')}" />`
    return `<label class="field${opts.wide ? ' wide' : ''}"><span class="f-label">${label}</span>${input}${opts.hint ? `<small class="f-hint">${opts.hint}</small>` : ''}</label>`
  }

  const tipsHtml = (tips, id) =>
    `<div class="tips" ${id ? `id="${id}"` : ''}>${tips
      .map((t) => `<div class="tip tip-${t.level}">${icon(t.level === 'warn' ? 'alert' : 'bulb', 14)}<span>${esc(t.text)}</span></div>`)
      .join('')}</div>`

  function renderInspector() {
    const tabs = floating()
      ? `<div class="insp-tabs">${seg(
          [
            ['content', `${icon('pen', 15)}<span>内容</span>`],
            ['design', `${icon('palette', 15)}<span>设计</span>`],
          ],
          state.mode,
          'data-mode'
        )}</div>`
      : ''
    return tabs + renderInspectorBody()
  }

  function renderInspectorBody() {
    if (state.mode === 'design') return renderDesign()
    if (state.selected === 'personal') {
      const p = state.doc.personal
      return `<div class="panel-head"><span class="ph-icon">${icon('user', 16)}</span><h3>个人信息</h3></div>
        <div class="insp-body">
          <div class="photo-row"><div class="photo">${icon('user', 26)}</div><div><strong>头像</strong><p class="muted">可选。国内岗位常见，外企 / ATS 建议不放</p>${btn(`${icon('upload', 15)}<span>上传照片</span>`, 'data-toast="选择图片，自动裁剪压缩"', 'btn btn-sm')}</div></div>
          <div class="fields">
            ${field('姓名', 'personal:name', p.name)}
            ${field('求职意向', 'personal:title', p.title)}
            ${field('电话', 'personal:phone', p.phone)}
            ${field('邮箱', 'personal:email', p.email)}
            ${field('所在城市', 'personal:location', p.location)}
            ${field('到岗时间', 'personal:availability', p.availability)}
            ${field('个人网站', 'personal:website', p.website)}
            ${field('GitHub', 'personal:github', p.github)}
          </div>
        </div>`
    }
    const s = section(state.selected)
    if (!s) return ''
    const head = `<div class="panel-head"><span class="ph-icon">${icon(s.icon, 16)}</span><input class="title-input" data-bind="title:${s.id}" value="${esc(s.title)}" aria-label="区块标题" />
      <button type="button" class="icon-btn" data-togglevis="${s.id}" aria-label="显示/隐藏">${icon(s.visible ? 'eye' : 'eyeOff', 16)}</button></div>`
    const coach =
      F.coach && ['experience', 'projects'].includes(s.id)
        ? `<div class="coach"><div class="coach-head">${icon('sparkles', 16)}<strong>写作小助手</strong></div><p>好的经历描述 = <b>动作</b> + <b>做了什么</b> + <b>结果数字</b>。<br/>例如：“主导表格组件重构，首屏耗时降低 42%”。</p></div>`
        : ''
    if (s.kind === 'text') {
      return `${head}<div class="insp-body">${coach}${field('内容', `text:${s.id}`, s.text, {
        textarea: true,
        rows: 10,
        wide: true,
        hint: '每行以 “- ” 开头会显示为列表，**文字** 加粗',
      })}</div>`
    }
    const labels = FIELD_LABELS[s.id] || FIELD_LABELS.awards
    const open = state.expanded[s.id] ?? 0
    const cards = s.items
      .map((it, i) => {
        const isOpen = open === i
        const tips = entryTips(s.id, it)
        return `<div class="entry-card${isOpen ? ' is-open' : ''}">
          <button type="button" class="entry-head" data-expand="${s.id}:${i}" aria-expanded="${isOpen}">
            <span class="eh-grip">${icon('grip', 14)}</span>
            <span class="eh-text"><strong data-label="${s.id}:${i}">${esc(it.title || '未命名')}</strong><small>${esc([it.subtitle, it.date].filter(Boolean).join(' · '))}</small></span>
            ${tips.length ? `<span class="eh-tips">${tips.length}</span>` : ''}
            ${icon('chevDown', 16)}
          </button>
          ${
            isOpen
              ? `<div class="entry-body"><div class="fields">
              ${field(labels.title, `entry:${s.id}:${i}:title`, it.title)}
              ${field(labels.subtitle, `entry:${s.id}:${i}:subtitle`, it.subtitle)}
              ${field(labels.date, `entry:${s.id}:${i}:date`, it.date, { placeholder: '2023.07 - 至今' })}
              ${labels.tags ? field(labels.tags, `entry:${s.id}:${i}:tags`, it.tags, { placeholder: '用逗号分隔' }) : ''}
              ${field(labels.details, `entry:${s.id}:${i}:details`, it.details, {
                textarea: true,
                rows: 6,
                wide: true,
                hint: `<span data-count="${s.id}:${i}">${bullets(it.details).length} 条要点 · ${it.details.length} 字</span>`,
              })}
              </div>${tipsHtml(tips, `tips-${s.id}-${i}`)}
              <div class="entry-actions">${btn(`${icon('sparkles', 14)}<span>润色建议</span>`, 'data-toast="AI 润色：给出 3 种改写（规划中）"', 'btn btn-ghost btn-sm')}${btn('删除', `data-remove="${s.id}:${i}"`, 'btn btn-ghost btn-sm btn-danger')}</div>
            </div>`
              : ''
          }
        </div>`
      })
      .join('')
    return `${head}<div class="insp-body">${coach}<div class="entries">${cards}</div>
      <button type="button" class="add-entry" data-add="${s.id}">${icon('plus', 15)}<span>添加一条${esc(s.title.replace(/经历|背景|奖项/, ''))}</span></button></div>`
  }

  function slider(key, label, min, max, step, unit) {
    const v = state.design[key]
    return `<label class="slider-row"><span class="sl-label">${label}</span><input type="range" data-design="${key}" min="${min}" max="${max}" step="${step}" value="${v}" /><output id="out-${key}">${fmtDesign(key, v)}</output></label>`
  }
  const fmtDesign = (key, v) => (key === 'lineHeight' ? Number(v).toFixed(2) : `${v}${key === 'fontSize' ? 'px' : 'px'}`)

  function renderDesign() {
    const d = state.design
    return `<div class="panel-head"><span class="ph-icon">${icon('palette', 16)}</span><h3>设计</h3>${btn('重置', 'data-action="reset-design"', 'btn btn-ghost btn-sm')}</div>
      <div class="insp-body design">
        <section class="group"><h4>模板</h4><div class="tpl-grid">${TEMPLATES.map(
          (t) => `<button type="button" class="tpl-card${d.template === t.id ? ' is-active' : ''}" data-template="${t.id}"><div class="doc-thumb"><div class="js-scale">${renderResume(state.doc, { ...d, template: t.id })}</div></div><span>${t.name}</span></button>`
        ).join('')}</div><button type="button" class="link-btn" data-toast="打开模板中心（11 套）">查看全部 11 套模板 ${icon('chevRight', 14)}</button></section>
        <section class="group"><h4>主题色</h4><div class="swatches">${ACCENTS.map(
          (c) => `<button type="button" class="swatch${d.accent === c ? ' is-active' : ''}" style="--c:${c}" data-accent="${c}" aria-label="${c}"></button>`
        ).join('')}<label class="swatch custom" title="自定义颜色"><input type="color" data-design="accent" value="${d.accent}" />${icon('plus', 14)}</label></div></section>
        <section class="group"><h4>字体</h4>${seg(
          FONTS.map((f) => [f.id, f.name]),
          d.font,
          'data-font'
        )}</section>
        <section class="group"><h4>排版</h4>
          ${slider('fontSize', '字号', 12, 16, 0.5)}
          ${slider('lineHeight', '行高', 1.3, 1.9, 0.05)}
          ${slider('margin', '页边距', 24, 64, 2)}
          ${slider('gap', '区块间距', 6, 28, 1)}
        </section>
        <section class="group"><h4>细节</h4>
          <label class="toggle-row"><span>区块标题图标</span><input type="checkbox" class="toggle" data-design-toggle="showIcons" ${d.showIcons ? 'checked' : ''} /></label>
          <button type="button" class="link-btn" data-toast="每个区块可单独设置：日期位置、标签样式、链接样式…">区块显示偏好 ${icon('chevRight', 14)}</button>
        </section>
      </div>`
  }

  function renderStatus() {
    const tips = allTips()
    return `<span>${icon('file', 13)} 第 1/${state.pages} 页</span>
      <span>${wordCount()} 字</span>
      <button type="button" class="sb-issues" data-goto="${tips[0] ? `${tips[0].section}:${tips[0].index}` : ''}">${icon('alert', 13)} ${tips.length} 条建议</button>
      <span class="sb-spacer"></span>
      <span>${icon('cloud', 13)} 本地 + GitHub 同步</span>
      <span><kbd>⌘K</kbd> 命令</span><span><kbd>Space</kbd> 拖动画布</span>`
  }

  function renderEditor() {
    const fl = floating()
    return `<div class="ed${fl ? ' ed-floating' : ''}">
      ${fl ? '' : renderTopbar()}
      <div class="ed-body">
        <aside class="ed-left panel" aria-label="大纲">${fl ? renderTopbar() : ''}<div id="outline">${renderOutline()}</div></aside>
        <main class="ed-canvas" id="canvas">${renderCanvas()}</main>
        <aside class="ed-right panel" id="inspector" aria-label="检查器">${renderInspector()}</aside>
      </div>
      ${F.statusbar ? `<footer class="statusbar" id="statusbar">${renderStatus()}</footer>` : ''}
      <nav class="mtabs" aria-label="编辑器视图">${[
        ['edit', 'pen', '编辑'],
        ['preview', 'eyeView', '预览'],
        ['design', 'palette', '设计'],
      ]
        .map(([k, ic, t]) => `<button type="button" class="${state.mtab === k ? 'is-active' : ''}" data-mtab="${k}">${icon(ic, 20)}<span>${t}</span></button>`)
        .join('')}</nav>
    </div>`
  }

  // ---------------------------------------------------------------- palette
  function paletteCommands() {
    return [
      ...state.doc.sections.map((s) => ({ group: '跳转', label: `编辑「${s.title}」`, icon: s.icon, run: () => selectSection(s.id, true) })),
      { group: '跳转', label: '编辑「个人信息」', icon: 'user', run: () => selectSection('personal', true) },
      ...TEMPLATES.map((t) => ({ group: '模板', label: `切换模板：${t.name}`, icon: 'layout', run: () => applyDesign({ template: t.id }, true) })),
      { group: '操作', label: '一键压缩到一页', icon: 'wand', run: () => fitOnePage() },
      { group: '操作', label: '导出 PDF', icon: 'download', run: () => toast('正在生成 PDF…（原型演示）') },
      { group: '操作', label: state.mode === 'design' ? '切换到内容模式' : '切换到设计模式', icon: 'palette', run: () => setMode(state.mode === 'design' ? 'content' : 'design') },
      { group: '操作', label: state.theme === 'dark' ? '切换到浅色主题' : '切换到深色主题', icon: 'moon', run: () => toggleTheme() },
      { group: '导航', label: '返回我的简历', icon: 'home', run: () => go('home') },
    ]
  }
  function renderPalette(query = '') {
    const q = query.trim().toLowerCase()
    const list = paletteCommands().filter((c) => !q || c.label.toLowerCase().includes(q))
    state.paletteIndex = Math.min(state.paletteIndex, Math.max(0, list.length - 1))
    let lastGroup = ''
    const rows = list
      .map((c, i) => {
        const g = c.group !== lastGroup ? `<div class="pal-group">${c.group}</div>` : ''
        lastGroup = c.group
        return `${g}<button type="button" class="pal-item${i === state.paletteIndex ? ' is-active' : ''}" data-pal="${i}">${icon(c.icon, 16)}<span>${esc(c.label)}</span>${i === state.paletteIndex ? '<kbd>↵</kbd>' : ''}</button>`
      })
      .join('')
    return { html: rows || '<div class="pal-empty">没有匹配的命令</div>', list }
  }
  function openPalette() {
    state.paletteOpen = true
    state.paletteIndex = 0
    const el = document.createElement('div')
    el.className = 'overlay'
    el.id = 'palette'
    el.innerHTML = `<div class="palette" role="dialog" aria-label="命令面板"><div class="pal-input">${icon('search', 18)}<input id="pal-q" placeholder="输入命令、区块或模板…" autocomplete="off" /><kbd>Esc</kbd></div><div class="pal-list" id="pal-list"></div></div>`
    app.appendChild(el)
    const input = el.querySelector('#pal-q')
    const draw = () => {
      el.querySelector('#pal-list').innerHTML = renderPalette(input.value).html
    }
    draw()
    input.focus()
    input.addEventListener('input', () => {
      state.paletteIndex = 0
      draw()
    })
    input.addEventListener('keydown', (e) => {
      const { list } = renderPalette(input.value)
      if (e.key === 'ArrowDown') {
        state.paletteIndex = (state.paletteIndex + 1) % Math.max(1, list.length)
        draw()
        e.preventDefault()
      } else if (e.key === 'ArrowUp') {
        state.paletteIndex = (state.paletteIndex - 1 + list.length) % Math.max(1, list.length)
        draw()
        e.preventDefault()
      } else if (e.key === 'Enter' && list[state.paletteIndex]) {
        closePalette()
        list[state.paletteIndex].run()
      }
    })
    el.addEventListener('click', (e) => {
      if (e.target === el) closePalette()
      const item = e.target.closest('[data-pal]')
      if (item) {
        const { list } = renderPalette(input.value)
        closePalette()
        list[Number(item.dataset.pal)]?.run()
      }
    })
  }
  function closePalette() {
    state.paletteOpen = false
    document.getElementById('palette')?.remove()
  }

  // ---------------------------------------------------------------- render + measure
  function render() {
    app.className = `app ${P.themeClass} device-${state.device}`
    app.dataset.theme = state.theme
    app.dataset.mtab = state.mtab
    app.dataset.mode = state.mode
    stage.classList.toggle('is-mobile', state.device === 'mobile')
    app.innerHTML = (state.view === 'home' ? renderHome() : renderEditor()) + '<div class="toast" id="toast" role="status"></div>'
    syncProtoBar()
    requestAnimationFrame(() => {
      scaleThumbs()
      if (state.view === 'editor') updateCanvas()
    })
  }

  function scaleThumbs(root = app) {
    root.querySelectorAll('.js-scale').forEach((el) => {
      const w = el.parentElement.clientWidth
      if (w) el.style.transform = `scale(${w / A4_W})`
    })
  }

  function currentZoom() {
    const scroll = document.getElementById('canvas-scroll')
    if (state.zoom !== 'fit') return state.zoom
    if (!scroll) return 1
    const pad = state.device === 'mobile' ? 24 : 72
    return Math.max(0.3, Math.min(1.15, (scroll.clientWidth - pad) / A4_W))
  }

  function updateCanvas() {
    const sheet = document.getElementById('sheet')
    if (!sheet) return
    sheet.innerHTML = renderResume(state.doc, state.design, { interactive: true, selected: state.selected })
    const page = sheet.querySelector('.rs-page')
    page.style.minHeight = '0px'
    const h = page.scrollHeight
    state.pages = Math.max(1, Math.ceil((h - 1) / A4_H))
    page.style.minHeight = `${state.pages * A4_H}px`
    for (let i = 1; i < state.pages; i++) {
      const line = document.createElement('div')
      line.className = 'page-break'
      line.style.top = `${i * A4_H}px`
      line.innerHTML = `<span>第 ${i} 页结束</span>`
      sheet.appendChild(line)
    }
    const rowH = state.design.fontSize * state.design.lineHeight
    state.overflowRows = h > A4_H ? Math.ceil((h - A4_H) / rowH) : 0
    state.spareRows = h <= A4_H ? Math.floor((A4_H - h) / rowH) : 0
    const z = currentZoom()
    sheet.style.transform = `scale(${z})`
    const wrap = document.getElementById('sheet-wrap')
    wrap.style.width = `${A4_W * z}px`
    wrap.style.height = `${state.pages * A4_H * z}px`
    const zv = document.getElementById('zoom-val')
    if (zv) zv.textContent = `${Math.round(z * 100)}%`
    const chip = document.getElementById('fit-chip')
    if (chip) {
      chip.className = `fit-chip ${state.overflowRows ? 'is-over' : 'is-ok'}`
      chip.innerHTML = state.overflowRows
        ? `${icon('alert', 15)}<span>超出一页 · 多 <b>${state.overflowRows}</b> 行</span><button type="button" class="btn btn-sm btn-primary" data-action="fit">${icon('wand', 14)}<span>压缩到一页</span></button>`
        : `${icon('check', 15)}<span>刚好一页 · 还能写约 <b>${state.spareRows}</b> 行</span>`
    }
    const sb = document.getElementById('statusbar')
    if (sb) sb.innerHTML = renderStatus()
  }

  function refreshOutline() {
    const el = document.getElementById('outline')
    if (el) el.innerHTML = renderOutline()
  }
  function refreshInspector() {
    const el = document.getElementById('inspector')
    if (el) {
      el.innerHTML = renderInspector()
      requestAnimationFrame(() => scaleThumbs(el))
    }
  }
  function refreshTopbar() {
    const tb = app.querySelector('.topbar')
    if (tb) tb.outerHTML = renderTopbar()
  }

  // ---------------------------------------------------------------- state changes
  let saveTimer
  let commitTimer
  function markDirty({ immediate = false } = {}) {
    state.saved = false
    const ss = document.getElementById('save-state')
    if (ss) ss.innerHTML = saveLabel()
    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
      state.saved = true
      const s2 = document.getElementById('save-state')
      if (s2) s2.innerHTML = saveLabel()
    }, 700)
    clearTimeout(commitTimer)
    const commit = () => {
      const snap = JSON.stringify({ doc: state.doc, design: state.design })
      if (snap === lastSnapshot) return
      undoStack.push(lastSnapshot)
      if (undoStack.length > 100) undoStack.shift()
      redoStack.length = 0
      lastSnapshot = snap
      app.querySelectorAll('[data-action="undo"]').forEach((b) => (b.disabled = false))
      app.querySelectorAll('[data-action="redo"]').forEach((b) => (b.disabled = true))
    }
    if (immediate) commit()
    else commitTimer = setTimeout(commit, 500)
  }

  function restore(snap) {
    const parsed = JSON.parse(snap)
    state.doc = parsed.doc
    state.design = parsed.design
    lastSnapshot = snap
    render()
  }

  function go(view) {
    state.view = view
    state.exportOpen = false
    state.metaOpen = false
    writeHash()
    render()
  }
  function setMode(mode) {
    state.mode = mode
    if (state.device === 'mobile') state.mtab = mode === 'design' ? 'design' : 'edit'
    app.dataset.mode = mode
    app.dataset.mtab = state.mtab
    writeHash()
    refreshTopbar()
    refreshInspector()
    app.querySelectorAll('[data-mtab]').forEach((b) => b.classList.toggle('is-active', b.dataset.mtab === state.mtab))
  }
  function selectSection(id, focus) {
    state.selected = id
    if (state.mode === 'design' && focus) setMode('content')
    if (state.device === 'mobile' && state.mtab !== 'edit') {
      state.mtab = 'edit'
      state.mode = 'content'
      render()
      return
    }
    refreshOutline()
    refreshInspector()
    app.querySelectorAll('.rs-section, .rs-head').forEach((el) => el.classList.toggle('is-selected', el.dataset.select === id))
    if (focus) {
      const target = app.querySelector(`#sheet [data-select="${id}"]`)
      target?.scrollIntoView({ behavior: 'smooth', block: 'center' })
    }
  }
  function applyDesign(patch, rerenderInspector) {
    Object.assign(state.design, patch)
    markDirty({ immediate: true })
    updateCanvas()
    if (rerenderInspector) refreshInspector()
  }
  function toggleTheme() {
    state.theme = state.theme === 'dark' ? 'light' : 'dark'
    app.dataset.theme = state.theme
    if (state.view === 'editor') refreshTopbar()
    else render()
  }

  function fitOnePage() {
    const d = state.design
    const before = { ...d }
    const steps = [
      () => d.lineHeight > 1.45 && (d.lineHeight = Math.round((d.lineHeight - 0.05) * 100) / 100),
      () => d.gap > 10 && (d.gap -= 2),
      () => d.margin > 32 && (d.margin -= 4),
      () => d.fontSize > 12.5 && (d.fontSize -= 0.5),
    ]
    let guard = 0
    updateCanvas()
    while (state.overflowRows > 0 && guard < 40) {
      const changed = steps.some((s) => s())
      if (!changed) break
      updateCanvas()
      guard++
    }
    markDirty({ immediate: true })
    if (state.mode === 'design') refreshInspector()
    const parts = []
    if (d.lineHeight !== before.lineHeight) parts.push(`行高 ${before.lineHeight}→${d.lineHeight}`)
    if (d.gap !== before.gap) parts.push(`间距 ${before.gap}→${d.gap}`)
    if (d.margin !== before.margin) parts.push(`边距 ${before.margin}→${d.margin}`)
    if (d.fontSize !== before.fontSize) parts.push(`字号 ${before.fontSize}→${d.fontSize}`)
    toast(state.overflowRows ? '已尽力压缩，仍超出一页，建议精简内容' : `已压缩到一页：${parts.join('，') || '无需调整'}　⌘Z 可撤销`)
  }

  let toastTimer
  function toast(text) {
    const el = document.getElementById('toast')
    if (!el) return
    el.textContent = text
    el.classList.add('is-show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('is-show'), 2600)
  }

  // ---------------------------------------------------------------- events
  app.addEventListener('click', (e) => {
    const t = e.target.closest(
      '[data-go],[data-mode],[data-select],[data-togglevis],[data-expand],[data-add],[data-remove],[data-template],[data-accent],[data-font],[data-zoom],[data-mtab],[data-export],[data-action],[data-toast],[data-goto]'
    )
    if (!t) {
      if (state.exportOpen || state.metaOpen) {
        if (!e.target.closest('.menu, .popover')) {
          state.exportOpen = false
          state.metaOpen = false
          refreshTopbar()
        }
      }
      return
    }
    const ds = t.dataset
    if (t.tagName === 'A') e.preventDefault()

    if (ds.togglevis) {
      e.stopPropagation()
      const s = section(ds.togglevis)
      s.visible = !s.visible
      markDirty({ immediate: true })
      refreshOutline()
      refreshInspector()
      updateCanvas()
      return
    }
    if (ds.go) return go(ds.go)
    if (ds.mode) return setMode(ds.mode)
    if (ds.goto !== undefined) {
      if (!ds.goto) return
      const [sid, idx] = ds.goto.split(':')
      state.expanded[sid] = Number(idx)
      state.selected = sid
      state.mode = 'content'
      state.mtab = 'edit'
      if (state.view !== 'editor') return go('editor')
      return render()
    }
    if (ds.select) {
      if (state.device === 'mobile' && t.closest('#sheet')) {
        state.mtab = 'edit'
        state.mode = 'content'
        state.selected = ds.select
        return render()
      }
      return selectSection(ds.select, !t.closest('#sheet'))
    }
    if (ds.expand) {
      const [sid, idx] = ds.expand.split(':')
      state.expanded[sid] = state.expanded[sid] === Number(idx) ? -1 : Number(idx)
      return refreshInspector()
    }
    if (ds.add) {
      const s = section(ds.add)
      s.items.push({ title: '', subtitle: '', date: '', tags: '', details: '- ' })
      state.expanded[s.id] = s.items.length - 1
      markDirty({ immediate: true })
      refreshInspector()
      refreshOutline()
      updateCanvas()
      app.querySelector('.entry-card.is-open input')?.focus()
      return
    }
    if (ds.remove) {
      const [sid, idx] = ds.remove.split(':')
      section(sid).items.splice(Number(idx), 1)
      markDirty({ immediate: true })
      refreshInspector()
      refreshOutline()
      updateCanvas()
      return toast('已删除，⌘Z 可撤销')
    }
    if (ds.template) return applyDesign({ template: ds.template }, true)
    if (ds.accent) return applyDesign({ accent: ds.accent }, true)
    if (ds.font) return applyDesign({ font: ds.font }, true)
    if (ds.zoom) {
      const z = currentZoom()
      state.zoom = ds.zoom === 'fit' ? 'fit' : Math.max(0.3, Math.min(2, Math.round((z + (ds.zoom === '+' ? 0.1 : -0.1)) * 10) / 10))
      return updateCanvas()
    }
    if (ds.mtab) {
      state.mtab = ds.mtab
      if (ds.mtab === 'design') state.mode = 'design'
      if (ds.mtab === 'edit') state.mode = 'content'
      writeHash()
      return render()
    }
    if (ds.export) {
      state.exportOpen = false
      refreshTopbar()
      return toast(`正在导出 ${ds.export}…（原型演示）`)
    }
    if (ds.action) {
      switch (ds.action) {
        case 'export':
          state.exportOpen = !state.exportOpen
          state.metaOpen = false
          return refreshTopbar()
        case 'meta':
          state.metaOpen = !state.metaOpen
          state.exportOpen = false
          refreshTopbar()
          app.querySelector('.meta-pop input')?.focus()
          return
        case 'undo':
          if (undoStack.length) {
            redoStack.push(lastSnapshot)
            restore(undoStack.pop())
            toast('已撤销')
          }
          return
        case 'redo':
          if (redoStack.length) {
            undoStack.push(lastSnapshot)
            restore(redoStack.pop())
          }
          return
        case 'fit':
          return fitOnePage()
        case 'palette':
          return openPalette()
        case 'theme':
          return toggleTheme()
        case 'reset-design':
          state.design = clone(DEFAULT_DESIGN)
          markDirty({ immediate: true })
          updateCanvas()
          return refreshInspector()
      }
    }
    if (ds.toast) return toast(ds.toast)
  })

  app.addEventListener('input', (e) => {
    const t = e.target
    if (t.dataset.bind) {
      const parts = t.dataset.bind.split(':')
      const v = t.value
      if (parts[0] === 'personal') state.doc.personal[parts[1]] = v
      else if (parts[0] === 'title') {
        section(parts[1]).title = v
        const ol = app.querySelector(`.ol-item[data-select="${parts[1]}"] .ol-title`)
        if (ol) ol.textContent = v
      } else if (parts[0] === 'text') section(parts[1]).text = v
      else if (parts[0] === 'meta') {
        if (parts[1] === 'tags') state.doc.tags = v.split(/[,，]/).map((s) => s.trim()).filter(Boolean)
        else state.doc[parts[1]] = v
        const n = app.querySelector('.dt-name')
        if (n && parts[1] === 'name') n.textContent = v
        const ver = app.querySelector('.doc-title .ver')
        if (ver && parts[1] === 'version') ver.textContent = `v${v}`
      } else if (parts[0] === 'entry') {
        const [, sid, idx, key] = parts
        const item = section(sid).items[Number(idx)]
        item[key] = v
        const label = app.querySelector(`[data-label="${sid}:${idx}"]`)
        if (label && key === 'title') label.textContent = v || '未命名'
        if (key === 'details') {
          const c = app.querySelector(`[data-count="${sid}:${idx}"]`)
          if (c) c.textContent = `${bullets(v).length} 条要点 · ${v.length} 字`
          const tips = document.getElementById(`tips-${sid}-${idx}`)
          if (tips) tips.outerHTML = tipsHtml(entryTips(sid, item), `tips-${sid}-${idx}`)
        }
      }
      markDirty()
      updateCanvas()
      return
    }
    if (t.dataset.design) {
      const key = t.dataset.design
      state.design[key] = key === 'accent' ? t.value : Number(t.value)
      const out = document.getElementById(`out-${key}`)
      if (out) out.textContent = fmtDesign(key, state.design[key])
      markDirty()
      updateCanvas()
      return
    }
    if (t.dataset.designToggle) {
      state.design[t.dataset.designToggle] = t.checked
      markDirty({ immediate: true })
      updateCanvas()
    }
  })
  app.addEventListener('change', (e) => {
    if (e.target.dataset.design === 'accent') refreshInspector()
  })

  // drag & drop reorder in outline
  let dragId = null
  app.addEventListener('dragstart', (e) => {
    const li = e.target.closest('[data-drag]')
    if (!li) return
    dragId = li.dataset.drag
    li.classList.add('is-dragging')
    e.dataTransfer.effectAllowed = 'move'
  })
  app.addEventListener('dragover', (e) => {
    const li = e.target.closest('[data-drag]')
    if (!li || !dragId) return
    e.preventDefault()
    app.querySelectorAll('.drop-target').forEach((el) => el.classList.remove('drop-target'))
    li.classList.add('drop-target')
  })
  app.addEventListener('drop', (e) => {
    const li = e.target.closest('[data-drag]')
    if (!li || !dragId) return
    e.preventDefault()
    const list = state.doc.sections
    const from = list.findIndex((s) => s.id === dragId)
    const to = list.findIndex((s) => s.id === li.dataset.drag)
    if (from > -1 && to > -1 && from !== to) {
      const [moved] = list.splice(from, 1)
      list.splice(to, 0, moved)
      markDirty({ immediate: true })
      updateCanvas()
    }
    dragId = null
    refreshOutline()
  })
  app.addEventListener('dragend', () => {
    dragId = null
    refreshOutline()
  })

  window.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey
    if (mod && e.key.toLowerCase() === 'k' && F.palette) {
      e.preventDefault()
      state.paletteOpen ? closePalette() : openPalette()
    } else if (e.key === 'Escape') {
      if (state.paletteOpen) closePalette()
      if (state.exportOpen || state.metaOpen) {
        state.exportOpen = false
        state.metaOpen = false
        refreshTopbar()
      }
    } else if (mod && e.key.toLowerCase() === 'z' && state.view === 'editor' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName)) {
      e.preventDefault()
      app.querySelector(`[data-action="${e.shiftKey ? 'redo' : 'undo'}"]`)?.click()
    }
  })

  let resizeTimer
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer)
    resizeTimer = setTimeout(() => {
      scaleThumbs()
      updateCanvas()
    }, 80)
  })

  // ---------------------------------------------------------------- prototype bar (原型控制，不属于设计)
  function writeHash() {
    const params = new URLSearchParams()
    params.set('view', state.view)
    if (state.device === 'mobile' && !realPhone) params.set('device', 'mobile')
    if (state.mode === 'design') params.set('mode', 'design')
    history.replaceState(null, '', `#${params}`)
    document.querySelectorAll('[data-pb-link]').forEach((a) => {
      a.href = `${a.dataset.pbLink}#${params}`
    })
  }
  function syncProtoBar() {
    document.querySelectorAll('[data-pb-view]').forEach((b) => b.classList.toggle('is-on', b.dataset.pbView === state.view))
    document.querySelectorAll('[data-pb-device]').forEach((b) => b.classList.toggle('is-on', b.dataset.pbDevice === state.device))
  }
  document.querySelector('.proto-bar')?.addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    if (b.dataset.pbView) go(b.dataset.pbView)
    if (b.dataset.pbDevice) {
      state.device = b.dataset.pbDevice
      state.zoom = 'fit'
      writeHash()
      render()
    }
  })

  writeHash()
  render()
})()

</script>
</body>
</html>
