<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>iResume 3.0 原型 · 方案 E「所见即所得」</title>
<style>
/* ===================================================================
   共用骨架：布局 / 组件结构 / 移动端 / 简历产物样式
   主题文件只负责 token 与风格化细节
   =================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  height: 100%;
}
body {
  background: #c9cdd3;
  -webkit-font-smoothing: antialiased;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
.i {
  flex: none;
  display: block;
}
kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  line-height: 1;
  padding: 3px 5px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-3);
}

/* ---------------- 原型控制条（不属于设计） ---------------- */
.proto-bar {
  position: fixed;
  inset: 0 0 auto 0;
  height: 42px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px;
  background: #0b0b0c;
  color: #9a9a9f;
  font: 12px/1 -apple-system, "PingFang SC", system-ui, sans-serif;
  white-space: nowrap;
  overflow-x: auto;
  scrollbar-width: none;
}
.proto-bar strong {
  color: #fff;
  font-weight: 600;
}
.pb-dir {
  color: #fff;
  background: #2a2a2e;
  padding: 5px 9px;
  border-radius: 6px;
}
.pb-group {
  display: flex;
  gap: 2px;
  background: #1c1c1f;
  padding: 3px;
  border-radius: 8px;
}
.pb-group a,
.pb-group button {
  color: #b6b6bb;
  background: none;
  border: 0;
  padding: 6px 10px;
  border-radius: 6px;
  text-decoration: none;
  font: inherit;
}
.pb-group .is-on {
  background: #fff;
  color: #0b0b0c;
}
.pb-spacer {
  flex: 1;
}
.stage {
  position: fixed;
  inset: 42px 0 0 0;
  display: grid;
  place-items: center;
}
.stage #app {
  width: 100%;
  height: 100%;
}
.stage.is-mobile #app {
  width: 390px;
  height: min(844px, calc(100% - 36px));
  border-radius: 38px;
  box-shadow:
    0 0 0 11px #111,
    0 30px 80px rgb(0 0 0 / 0.35);
}
.real-phone .stage.is-mobile #app {
  width: 100%;
  height: 100%;
  border-radius: 0;
  box-shadow: none;
}

/* ---------------- App 根 ---------------- */
.app {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: var(--fs);
  line-height: 1.5;
}
.muted {
  color: var(--text-3);
  margin: 2px 0 8px;
  font-size: 0.88em;
}

/* ---------------- 基础组件 ---------------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--ctl-h);
  padding: 0 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 500;
  white-space: nowrap;
  transition:
    background 0.15s,
    border-color 0.15s,
    color 0.15s,
    box-shadow 0.15s;
}
.btn:hover {
  background: var(--surface-2);
}
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-fg);
}
.btn-primary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-2);
}
.btn-ghost:hover {
  background: var(--surface-2);
  color: var(--text);
}
.btn-sm {
  height: calc(var(--ctl-h) - 8px);
  padding: 0 10px;
  font-size: 0.9em;
}
.btn-danger {
  color: var(--danger);
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: var(--ctl-h);
  height: var(--ctl-h);
  border-radius: var(--radius-sm);
  border: 0;
  background: transparent;
  color: var(--text-2);
  transition: background 0.15s;
}
.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
  color: var(--text);
}
.icon-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
:where(button, a, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 10px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--accent);
  font-size: 0.92em;
}

.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.seg button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: calc(var(--ctl-h) - 10px);
  padding: 0 12px;
  border: 0;
  border-radius: calc(var(--radius-sm) - 2px);
  background: transparent;
  color: var(--text-2);
  font-weight: 500;
}
.seg button.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12px;
}
.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field.wide {
  grid-column: 1 / -1;
}
.f-label,
.field > span:first-child {
  font-size: 0.86em;
  font-weight: 500;
  color: var(--text-2);
}
.field input,
.field textarea,
.search input {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  padding: 8px 10px;
  outline: none;
  transition:
    border-color 0.15s,
    box-shadow 0.15s;
}
.field input {
  height: var(--ctl-h);
}
.field textarea {
  resize: vertical;
  line-height: 1.65;
}
.field input:focus,
.field textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.f-hint {
  color: var(--text-3);
  font-size: 0.82em;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 12px;
}
.field-row {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.field-row .field {
  flex: 1;
}

.toggle {
  appearance: none;
  width: 36px;
  height: 20px;
  border-radius: 999px;
  background: var(--border-strong);
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  margin: 0;
}
.toggle::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
  transition: transform 0.2s;
}
.toggle:checked {
  background: var(--accent);
}
.toggle:checked::after {
  transform: translateX(16px);
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 28px;
  z-index: 80;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  max-width: calc(100% - 32px);
  padding: 10px 16px;
  border-radius: var(--radius);
  background: var(--toast-bg, #1f2328);
  color: #fff;
  font-size: 13px;
  box-shadow: var(--shadow);
  transition:
    opacity 0.2s,
    transform 0.2s;
}
.toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

.menu-wrap,
.doc-meta-wrap {
  position: relative;
}
.menu,
.popover {
  position: absolute;
  top: calc(100% + 8px);
  z-index: 50;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  animation: pop 0.14s ease-out;
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(-4px);
  }
}
.menu {
  right: 0;
  width: 248px;
  padding: 6px;
}
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 9px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
  color: var(--text-2);
}
.menu-item span {
  display: flex;
  flex-direction: column;
}
.menu-item strong {
  color: var(--text);
  font-weight: 500;
}
.menu-item small {
  color: var(--text-3);
  font-size: 12px;
}
.menu-item:hover {
  background: var(--surface-2);
}
.popover {
  left: 0;
  width: 300px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* ---------------- 首页 ---------------- */
.home {
  height: 100%;
  display: grid;
  grid-template-columns: var(--nav-w) minmax(0, 1fr);
}
.home-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 20px 14px;
  border-right: 1px solid var(--border);
  background: var(--nav-bg, var(--surface));
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 18px;
}
.logo {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-fg);
  font-weight: 700;
  font-family: var(--font-display);
}
.brand-name {
  font-weight: 700;
  font-size: 17px;
  font-family: var(--font-display);
}
.brand-sub {
  color: var(--text-3);
  font-size: 12px;
}
.nav-items {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  text-decoration: none;
  font-weight: 500;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.is-active {
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.nav-foot {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  color: var(--text-3);
  font-size: 12px;
}
.sync-state {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.home-main {
  overflow: auto;
  min-height: 0;
}
.home-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: var(--page-pad);
  display: flex;
  flex-direction: column;
  gap: 44px;
}
.home-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.home-head h1 {
  margin: 4px 0 6px;
  font-family: var(--font-display);
  font-size: var(--h1);
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.eyebrow {
  margin: 0;
  color: var(--text-3);
  font-size: 13px;
}
.lead {
  margin: 0;
  color: var(--text-2);
  max-width: 46ch;
}
.home-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}
.search {
  position: relative;
  display: flex;
  align-items: center;
  color: var(--text-3);
}
.search .i {
  position: absolute;
  left: 10px;
}
.search input {
  height: var(--ctl-h);
  width: 240px;
  padding-left: 34px;
}
.search-trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--ctl-h);
  width: 300px;
  padding: 0 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--input-bg);
  color: var(--text-3);
  text-align: left;
}
.search-trigger span {
  flex: 1;
}
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.sec-head h2 {
  margin: 0;
  font-size: var(--h2);
  font-family: var(--font-display);
  display: flex;
  align-items: center;
  gap: 8px;
}
.count {
  font-family: var(--font-ui);
  font-size: 12px;
  font-weight: 500;
  color: var(--text-3);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 2px 8px;
}
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip-btn {
  height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-2);
  font-size: 13px;
}
.chip-btn.is-active {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}

.doc-grid,
.tpl-strip {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(212px, 1fr));
  gap: 20px;
}
.doc-card,
.tpl-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  border-radius: var(--radius);
  cursor: pointer;
}
.doc-thumb {
  position: relative;
  overflow: hidden;
  aspect-ratio: 210 / 297;
  background: #fff;
  border-radius: var(--thumb-radius, var(--radius-sm));
}
.js-scale {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  transform-origin: 0 0;
  pointer-events: none;
}
.doc-info {
  padding: 12px 2px 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.doc-info h3 {
  margin: 0;
  font-size: 15px;
  font-weight: 600;
}
.doc-meta {
  margin: 0;
  display: flex;
  gap: 10px;
  color: var(--text-3);
  font-size: 12px;
}
.doc-more {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--surface);
  box-shadow: var(--shadow-sm);
  opacity: 0;
}
.doc-card:hover .doc-more,
.doc-card:focus-within .doc-more {
  opacity: 1;
}
.doc-badge {
  position: absolute;
  bottom: 10px;
  left: 10px;
  box-shadow: var(--shadow-sm);
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 11px;
  font-weight: 600;
}
.tpl-info {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 2px 0;
}
.start-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 14px;
}
.start-tile {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 18px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text-3);
  font-size: 13px;
  transition:
    border-color 0.15s,
    transform 0.15s,
    box-shadow 0.15s;
}
.start-tile:hover {
  border-color: var(--accent);
  box-shadow: var(--shadow);
}
.start-tile strong {
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
}
.st-icon {
  display: grid;
  place-items: center;
  width: 38px;
  height: 38px;
  margin-bottom: 8px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.mnav {
  display: none;
}

/* progress card (C) */
.progress-card {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 24px;
  border-radius: var(--radius-lg);
  background: var(--surface);
  box-shadow: var(--shadow);
}
.pc-ring {
  position: relative;
  display: grid;
  place-items: center;
}
.pc-ring strong {
  position: absolute;
  font-size: 22px;
}
.pc-ring small {
  font-size: 12px;
}
.pc-body {
  flex: 1;
  min-width: 0;
}
.pc-body h2 {
  margin: 0 0 4px;
  font-size: 18px;
}
.pc-body p {
  margin: 0 0 10px;
  color: var(--text-2);
}
.pc-steps {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.pc-steps button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  text-align: left;
  font-size: 13px;
}
.pc-steps button span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pc-steps button:hover {
  color: var(--text);
}
.ring-track {
  fill: none;
  stroke: var(--surface-2);
  stroke-width: 5;
}
.ring-bar {
  fill: none;
  stroke: var(--accent);
  stroke-width: 5;
  stroke-linecap: round;
  transition: stroke-dasharray 0.4s;
}

/* ---------------- 编辑器 ---------------- */
.ed {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}
.topbar {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 12px;
  height: var(--topbar-h);
  padding: 0 12px;
  background: var(--topbar-bg, var(--surface));
  border-bottom: 1px solid var(--border);
  position: relative;
  z-index: 20;
}
.tb-left,
.tb-right {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.tb-right {
  justify-content: flex-end;
}
.doc-meta-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}
.doc-title {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  height: var(--ctl-h);
  padding: 0 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  font-weight: 600;
}
.doc-title:hover {
  background: var(--surface-2);
}
.dt-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ver {
  font-family: ui-monospace, Menlo, monospace;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-2);
}
.save-state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text-3);
  font-size: 12px;
  white-space: nowrap;
}
.save-state .i {
  color: var(--success);
}
.dot-pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warning);
  animation: pulse 0.9s infinite alternate;
}
@keyframes pulse {
  to {
    opacity: 0.3;
  }
}
.kbd-btn kbd {
  margin-left: 2px;
}
.tb-progress {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-right: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-2);
}
.tb-progress .ring-track,
.tb-progress .ring-bar {
  stroke-width: 4;
}

.ed-body {
  display: grid;
  grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
  gap: var(--ed-gap);
  padding: var(--ed-gap);
  min-height: 0;
  background: var(--desk);
}
.panel {
  min-height: 0;
  overflow: auto;
  background: var(--surface);
  scrollbar-width: thin;
}
.panel-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.panel-head h3 {
  margin: 0;
  flex: 1;
  font-size: 1em;
  font-weight: 600;
}
.ph-sub {
  color: var(--text-3);
  font-size: 12px;
}
.ph-icon {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.title-input {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 8px;
  margin-left: -4px;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  background: none;
  font-weight: 600;
  outline: none;
}
.title-input:hover {
  border-color: var(--border);
}
.title-input:focus {
  border-color: var(--accent);
  background: var(--input-bg);
}
.insp-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* outline */
.outline {
  list-style: none;
  margin: 0;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.ol-item {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 6px 0 4px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
}
.ol-item:hover {
  background: var(--surface-2);
}
.ol-item.is-active {
  background: var(--accent-soft);
  color: var(--accent-text, var(--accent));
}
.ol-item.is-hidden .ol-title,
.ol-item.is-hidden .ol-icon {
  opacity: 0.45;
}
.ol-item.is-dragging {
  opacity: 0.4;
}
.ol-item.drop-target {
  border-color: var(--accent);
  border-style: dashed;
}
.ol-grip {
  width: 14px;
  color: var(--text-3);
  opacity: 0;
  cursor: grab;
}
.ol-item:hover .ol-grip {
  opacity: 1;
}
.ol-title {
  flex: 1;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ol-count {
  font-size: 12px;
  color: var(--text-3);
}
.ol-tips {
  display: grid;
  place-items: center;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 11px;
  font-weight: 600;
}
.ol-done {
  display: none;
}
.ol-eye {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--text-3);
  opacity: 0;
}
.ol-item:hover .ol-eye,
.ol-item.is-hidden .ol-eye {
  opacity: 1;
}
.ol-eye:hover {
  background: var(--surface);
  color: var(--text);
}
.add-section,
.add-entry {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: var(--ctl-h);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius-sm);
  background: none;
  color: var(--text-2);
  font-weight: 500;
}
.add-section {
  margin: 4px 14px 14px;
  width: calc(100% - 28px);
}
.add-section:hover,
.add-entry:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.outline-foot p {
  display: flex;
  gap: 8px;
  margin: 0 14px 14px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text-2);
  font-size: 12.5px;
}

/* canvas */
.ed-canvas {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--desk);
  border-radius: var(--canvas-radius, 0);
}
.canvas-tools {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;
}
.zoom {
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: var(--radius);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.zoom .icon-btn {
  width: 28px;
  height: 28px;
}
.zoom-val {
  min-width: 46px;
  text-align: center;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--text-2);
}
.canvas-scroll {
  flex: 1;
  overflow: auto;
  padding: 64px 36px 96px;
  scrollbar-width: thin;
}
.sheet-wrap {
  position: relative;
  margin: 0 auto;
}
.sheet {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  transform-origin: 0 0;
  box-shadow: var(--paper-shadow);
}
.page-break {
  position: absolute;
  left: -28px;
  right: -28px;
  height: 0;
  border-top: 2px dashed var(--danger);
  pointer-events: none;
}
.page-break span {
  position: absolute;
  right: 28px;
  top: -24px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--danger);
  color: #fff;
  font: 600 12px/1.4 var(--font-ui);
}
.fit-chip {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 6px 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  color: var(--text-2);
  font-size: 13px;
  white-space: nowrap;
}
.fit-chip.is-ok {
  padding-right: 14px;
}
.fit-chip.is-ok .i {
  color: var(--success);
}
.fit-chip.is-over .i:first-child {
  color: var(--danger);
}
.fit-chip b {
  color: var(--text);
}
.fit-chip .btn {
  border-radius: 999px;
}

/* inspector */
.photo-row {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface-2);
}
.photo-row p {
  margin: 2px 0 8px;
}
.photo {
  display: grid;
  place-items: center;
  width: 64px;
  height: 80px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px dashed var(--border-strong);
  color: var(--text-3);
}
.entries {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.entry-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  transition: box-shadow 0.15s;
}
.entry-card.is-open {
  box-shadow: var(--shadow-sm);
}
.entry-head {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 10px 12px 10px 6px;
  border: 0;
  background: none;
  text-align: left;
  color: var(--text-3);
}
.entry-head > .i:last-child {
  transition: transform 0.15s;
}
.entry-card.is-open .entry-head > .i:last-child {
  transform: rotate(180deg);
}
.eh-grip {
  color: var(--text-3);
  opacity: 0.6;
}
.eh-text {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.eh-text strong {
  color: var(--text);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.eh-text small {
  font-size: 12px;
}
.eh-tips {
  display: grid;
  place-items: center;
  min-width: 20px;
  height: 20px;
  border-radius: 999px;
  background: var(--warning-soft);
  color: var(--warning);
  font-size: 11px;
  font-weight: 600;
}
.entry-body {
  padding: 4px 14px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.entry-actions {
  display: flex;
  justify-content: space-between;
}
.tips {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.tips:empty {
  display: none;
}
.tip {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text-2);
  background: var(--surface-2);
}
.tip .i {
  margin-top: 2px;
}
.tip-warn .i {
  color: var(--warning);
}
.tip-info .i {
  color: var(--accent);
}
.coach {
  padding: 14px;
  border-radius: var(--radius);
  background: var(--accent-soft);
  color: var(--text-2);
  font-size: 13px;
}
.coach-head {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--accent-text, var(--accent));
  margin-bottom: 6px;
}
.coach p {
  margin: 0;
  line-height: 1.7;
}

/* design panel */
.group h4 {
  margin: 0 0 10px;
  font-size: 0.86em;
  font-weight: 600;
  color: var(--text-2);
}
.tpl-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.tpl-card {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 12.5px;
  color: var(--text-2);
}
.tpl-card .doc-thumb {
  aspect-ratio: 4 / 3;
  border: 1px solid var(--border);
}
.tpl-card.is-active {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px var(--accent-soft);
  color: var(--accent-text, var(--accent));
  font-weight: 600;
}
.swatches {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.swatch {
  position: relative;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0;
  background: var(--c);
  box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1);
}
.swatch.is-active {
  box-shadow:
    0 0 0 2px var(--surface),
    0 0 0 4px var(--c);
}
.swatch.custom {
  display: grid;
  place-items: center;
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  border: 1px dashed var(--border-strong);
  box-shadow: none;
}
.swatch.custom input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}
.design .seg {
  display: flex;
}
.design .seg button {
  flex: 1;
  justify-content: center;
}
.slider-row {
  display: grid;
  grid-template-columns: 64px 1fr 48px;
  align-items: center;
  gap: 10px;
  min-height: 34px;
  font-size: 13px;
  color: var(--text-2);
}
.slider-row output {
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  font-size: 12px;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 34px;
  font-size: 13px;
  color: var(--text-2);
}

/* status bar (B) */
.statusbar {
  display: flex;
  align-items: center;
  gap: 16px;
  height: 26px;
  padding: 0 12px;
  border-top: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-3);
  font-size: 11.5px;
}
.statusbar span,
.sb-issues {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}
.sb-issues {
  border: 0;
  background: none;
  color: var(--warning);
  font-size: inherit;
  padding: 0;
}
.sb-spacer {
  flex: 1;
}
.statusbar kbd {
  padding: 1px 4px;
  font-size: 10px;
}

/* palette (B) */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 90;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 12vh;
  background: rgb(0 0 0 / 0.45);
  backdrop-filter: blur(2px);
  animation: pop 0.12s;
}
.palette {
  width: min(560px, calc(100% - 32px));
  border-radius: var(--radius-lg);
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
}
.pal-input {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  color: var(--text-3);
}
.pal-input input {
  flex: 1;
  border: 0;
  background: none;
  outline: none;
  font-size: 15px;
  color: var(--text);
}
.pal-list {
  max-height: 360px;
  overflow: auto;
  padding: 6px;
}
.pal-group {
  padding: 8px 10px 4px;
  font-size: 11px;
  color: var(--text-3);
  letter-spacing: 0.04em;
}
.pal-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 38px;
  padding: 0 10px;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  text-align: left;
  color: var(--text-2);
}
.pal-item span {
  flex: 1;
}
.pal-item.is-active {
  background: var(--accent-soft);
  color: var(--text);
}
.pal-empty {
  padding: 24px;
  text-align: center;
  color: var(--text-3);
}

.mtabs {
  display: none;
}

/* ===================================================================
   移动端（.device-mobile）
   =================================================================== */
.device-mobile {
  --ctl-h: 40px;
}
.device-mobile .home {
  grid-template-columns: 1fr;
  grid-template-rows: minmax(0, 1fr) auto;
}
.device-mobile .home-nav {
  display: none;
}
.device-mobile .home-inner {
  padding: 28px 18px 32px;
  gap: 32px;
}
.device-mobile .home-head h1 {
  font-size: 26px;
}
.device-mobile .home-actions {
  width: 100%;
}
.device-mobile .home-actions .btn-primary {
  display: none;
}
.device-mobile .search,
.device-mobile .search input,
.device-mobile .search-trigger {
  width: 100%;
}
.device-mobile .doc-grid,
.device-mobile .tpl-strip {
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}
.device-mobile .start-grid {
  grid-template-columns: 1fr 1fr;
}
.device-mobile .start-tile {
  padding: 14px;
}
.device-mobile .start-tile > span:last-child {
  display: none;
}
.device-mobile .progress-card {
  flex-direction: column;
  align-items: stretch;
  text-align: left;
}
.device-mobile .pc-ring {
  display: none;
}
.device-mobile .mnav {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 68px;
  padding: 0 8px 8px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.mnav button,
.mtabs button {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 56px;
  border: 0;
  background: none;
  color: var(--text-3);
  font-size: 11px;
}
.mnav button.is-active,
.mtabs button.is-active {
  color: var(--accent-text, var(--accent));
}
.mnav .mnav-fab {
  width: 48px;
  min-width: 48px;
  height: 48px;
  border-radius: 16px;
  justify-content: center;
  background: var(--accent);
  color: var(--accent-fg);
  box-shadow: var(--shadow);
}

.device-mobile .topbar {
  grid-template-columns: 1fr auto;
  height: 56px;
  padding: 0 8px;
}
.device-mobile .tb-center,
.device-mobile .save-state,
.device-mobile .kbd-btn,
.device-mobile [data-action="redo"],
.device-mobile .tb-progress,
.device-mobile .ver {
  display: none;
}
.device-mobile [data-action="export"] span,
.device-mobile [data-action="export"] .i:last-child {
  display: none;
}
.device-mobile [data-action="export"] {
  width: 40px;
  padding: 0;
}
.device-mobile .ed {
  grid-template-rows: auto minmax(0, 1fr) auto auto;
}
.device-mobile .ed-body {
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  padding: 0;
  gap: 0;
}
.device-mobile .ed-left,
.device-mobile .ed-right,
.device-mobile .ed-canvas {
  display: none;
  border-radius: 0;
  box-shadow: none;
  border: 0;
}
.device-mobile .statusbar {
  display: none;
}
.device-mobile[data-mtab="edit"] .ed-left {
  display: block;
  overflow: hidden;
  border-bottom: 1px solid var(--border);
}
.device-mobile[data-mtab="edit"] .ed-left > :not(#outline),
.device-mobile[data-mtab="edit"] #outline > :not(.outline) {
  display: none;
}
.device-mobile .outline {
  flex-direction: row;
  overflow-x: auto;
  gap: 6px;
  padding: 10px 12px;
  scrollbar-width: none;
}
.device-mobile .ol-item {
  flex: none;
  min-height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
}
.device-mobile .ol-item.is-active {
  border-color: transparent;
}
.device-mobile .ol-grip,
.device-mobile .ol-eye,
.device-mobile .ol-count,
.device-mobile .ol-done,
.device-mobile .ol-icon {
  display: none !important;
}
.device-mobile .ol-item::before {
  display: none !important;
}
.device-mobile[data-mtab="edit"] .ed-right,
.device-mobile[data-mtab="design"] .ed-right {
  display: block;
}
.device-mobile[data-mtab="design"] .ed-body {
  grid-template-rows: minmax(0, 1fr);
}
.device-mobile[data-mtab="preview"] .ed-canvas {
  display: flex;
}
.device-mobile[data-mtab="preview"] .ed-body {
  grid-template-rows: minmax(0, 1fr);
}
.device-mobile .canvas-scroll {
  padding: 16px 12px 88px;
}
.device-mobile .canvas-tools {
  display: none;
}
.device-mobile .fit-chip {
  bottom: 14px;
  max-width: calc(100% - 24px);
}
.device-mobile .fields {
  grid-template-columns: 1fr;
}
.device-mobile .tpl-grid {
  grid-template-columns: repeat(2, 1fr);
}
.device-mobile .mtabs {
  display: flex;
  justify-content: space-around;
  align-items: center;
  height: 64px;
  padding-bottom: 6px;
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.device-mobile .menu {
  position: fixed;
  top: auto;
  left: 8px;
  right: 8px;
  bottom: 8px;
  width: auto;
}
.device-mobile .popover {
  width: calc(100vw - 60px);
  max-width: 340px;
}
.device-mobile .canvas-scroll {
  overflow-x: hidden;
}

/* ===================================================================
   简历产物（独立 token：--rs-*，与 App 主题无关）
   =================================================================== */
.rs-page {
  position: relative;
  width: 794px;
  min-height: 1123px;
  padding: var(--rs-margin);
  background: #fff;
  color: #1f2328;
  font-family: var(--rs-font);
  font-size: var(--rs-size);
  line-height: var(--rs-lh);
  text-align: left;
}
.rs-page ul {
  margin: 0.15em 0 0;
  padding-left: 1.2em;
}
.rs-page li {
  margin: 0.08em 0;
}
.rs-page li::marker {
  color: color-mix(in srgb, var(--rs-accent) 70%, #999);
}
.rs-page p {
  margin: 0.15em 0;
}
.rs-page strong {
  font-weight: 600;
  color: #111;
}
.rs-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 24px;
  margin-bottom: calc(var(--rs-gap) * 1.1);
}
.rs-head h1 {
  margin: 0;
  font-size: 2.05em;
  line-height: 1.15;
  font-weight: 700;
  color: #111;
  letter-spacing: 0.02em;
}
.rs-title {
  margin-top: 0.25em;
  color: var(--rs-accent);
  font-weight: 500;
  font-size: 1.05em;
}
.rs-contacts {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: auto auto;
  gap: 0.15em 1.4em;
  font-size: 0.86em;
  color: #4b5563;
}
.rs-page .rs-contacts li {
  display: flex;
  align-items: center;
  gap: 0.45em;
  margin: 0;
}
.rs-contacts .i {
  color: var(--rs-accent);
  width: 1.05em;
  height: 1.05em;
}
.rs-section {
  margin-top: var(--rs-gap);
}
.rs-h {
  display: flex;
  align-items: center;
  gap: 0.45em;
  margin: 0 0 0.5em;
  padding-bottom: 0.3em;
  font-size: 1.12em;
  font-weight: 700;
  color: #111;
  border-bottom: 1px solid #e5e7eb;
}
.rs-h .i {
  color: var(--rs-accent);
}
.rs-entry + .rs-entry {
  margin-top: 0.7em;
}
.rs-entry-head {
  display: flex;
  align-items: baseline;
  gap: 0.8em;
}
.rs-entry-head strong {
  font-weight: 650;
}
.rs-sub {
  color: #4b5563;
}
.rs-date {
  margin-left: auto;
  color: #6b7280;
  font-size: 0.92em;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.rs-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35em;
  margin: 0.25em 0 0.1em;
}
.rs-tags span {
  padding: 0 0.5em;
  border-radius: 3px;
  font-size: 0.8em;
  line-height: 1.7;
  color: color-mix(in srgb, var(--rs-accent) 85%, #000);
  background: color-mix(in srgb, var(--rs-accent) 9%, #fff);
}
.rs-md {
  color: #374151;
}

/* 编辑器内可点击区块 */
.is-interactive {
  position: relative;
  cursor: pointer;
  border-radius: 4px;
  outline: 1.5px solid transparent;
  outline-offset: 6px;
  transition: outline-color 0.15s;
}
.is-interactive:hover {
  outline-color: color-mix(in srgb, var(--rs-accent) 30%, transparent);
}
.is-interactive.is-selected {
  outline-color: var(--rs-accent);
}

/* 模板：居中极简 */
.tpl-center .rs-head {
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
}
.tpl-center .rs-head h1 {
  font-size: 2.3em;
  letter-spacing: 0.12em;
  font-weight: 600;
}
.tpl-center .rs-contacts {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.2em 1.1em;
}
.tpl-center .rs-h {
  justify-content: center;
  border: 0;
  color: var(--rs-accent);
  font-size: 1em;
  letter-spacing: 0.2em;
  gap: 0.8em;
}
.tpl-center .rs-h::before,
.tpl-center .rs-h::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e5e7eb;
}

/* 模板：深色页眉 */
.tpl-banner .rs-head {
  margin: calc(var(--rs-margin) * -1) calc(var(--rs-margin) * -1) var(--rs-gap);
  padding: calc(var(--rs-margin) * 0.8) var(--rs-margin);
  background: color-mix(in srgb, var(--rs-accent) 22%, #0f1115);
  color: #fff;
  align-items: center;
}
.tpl-banner .rs-head h1 {
  color: #fff;
}
.tpl-banner .rs-title {
  color: color-mix(in srgb, var(--rs-accent) 40%, #fff);
}
.tpl-banner .rs-contacts {
  color: rgb(255 255 255 / 0.82);
}
.tpl-banner .rs-contacts .i {
  color: color-mix(in srgb, var(--rs-accent) 40%, #fff);
}
.tpl-banner .rs-h {
  border: 0;
  padding: 0 0 0 0.6em;
  border-left: 4px solid var(--rs-accent);
  line-height: 1.2;
}
.tpl-banner .is-interactive.rs-head {
  outline-offset: -4px;
}

/* 模板：书卷 */
.tpl-serif {
  --rs-font: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", Georgia, serif !important;
}
.tpl-serif .rs-head {
  padding-bottom: 0.8em;
  border-bottom: 3px double #1f2328;
}
.tpl-serif .rs-head h1 {
  font-size: 2.3em;
  letter-spacing: 0.15em;
}
.tpl-serif .rs-title {
  font-style: italic;
}
.tpl-serif .rs-h {
  border: 0;
  color: var(--rs-accent);
  letter-spacing: 0.18em;
  font-size: 1.05em;
  padding: 0;
}
.tpl-serif .rs-entry-head strong {
  font-weight: 700;
}
.tpl-serif .rs-sub {
  font-style: italic;
}
.tpl-serif .rs-tags span {
  background: none;
  padding: 0;
  font-style: italic;
}
.tpl-serif .rs-tags span + span::before {
  content: "· ";
}

/* ===================================================================
   方案 E ·「所见即所得」
   单色、留白、纸面优先。界面只在需要时出现：
   悬停才出现的工具、底部浮动 Dock、页边批注。蓝色只留给品牌 i 标。
   =================================================================== */
.x-app {
  --x-bg: #f7f7f8;
  --x-desk: #f1f1f3;
  --x-surface: #ffffff;
  --x-surface-2: #f4f4f5;
  --x-hover: rgb(0 0 0 / 0.045);
  --x-border: #e7e7ea;
  --x-border-2: #d9d9de;
  --x-text: #0b0b0d;
  --x-text-2: #52525b;
  --x-text-3: #71717a;
  --x-text-4: #a1a1aa;
  --x-primary: #111113;
  --x-primary-fg: #ffffff;
  --x-brand: #2563eb;
  --x-ok: #16a34a;
  --x-warn: #e08a00;
  --x-danger: #dc2626;
  --x-shadow-card: 0 0 0 1px rgb(0 0 0 / 0.06), 0 1px 2px rgb(0 0 0 / 0.04);
  --x-shadow-float: 0 0 0 1px rgb(0 0 0 / 0.06), 0 2px 6px rgb(0 0 0 / 0.04), 0 16px 40px rgb(0 0 0 / 0.1);
  --x-font: "Inter", -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  /* shared.css 里简历画布用到的变量 */
  --paper-shadow: 0 0 0 1px rgb(0 0 0 / 0.04), 0 2px 4px rgb(0 0 0 / 0.03), 0 28px 64px -16px rgb(0 0 0 / 0.16);
  --danger: var(--x-danger);
  --font-ui: var(--x-font);
  --border: var(--x-border);
  --surface-2: var(--x-surface-2);
  --text-3: var(--x-text-3);

  background: var(--x-bg);
  color: var(--x-text);
  font-family: var(--x-font);
  font-size: 14px;
  letter-spacing: -0.003em;
}
.x-app button {
  font: inherit;
  color: inherit;
}
.x-app :focus-visible {
  outline: 2px solid var(--x-brand);
  outline-offset: 2px;
}

/* ---------- 通用 ---------- */
.x-logo {
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  border-radius: 7px;
  background: var(--x-brand);
  color: #fff;
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0;
}
.x-logo.is-sm {
  width: 20px;
  height: 20px;
  border-radius: 6px;
  font-size: 11px;
}
.x-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border: 0;
  border-radius: 10px;
  background: none;
  font-weight: 500;
  white-space: nowrap;
  transition:
    background 0.15s,
    opacity 0.15s;
}
.x-btn.is-primary {
  background: var(--x-primary);
  color: var(--x-primary-fg);
}
.x-btn.is-primary:hover {
  opacity: 0.86;
}
.x-btn.is-ghost {
  color: var(--x-text-2);
}
.x-btn.is-ghost:hover {
  background: var(--x-hover);
  color: var(--x-text);
}
.x-btn.is-soft {
  background: var(--x-surface-2);
}
.x-btn.is-soft:hover {
  background: #ebebed;
}
.x-icon {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--x-text-2);
}
.x-icon:hover {
  background: var(--x-hover);
  color: var(--x-text);
}
.x-icon.is-sm {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  color: var(--x-text-4);
}
.x-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--x-text-4);
}
.x-dot.is-ok {
  background: var(--x-ok);
}
.x-dot.is-busy {
  background: var(--x-warn);
  animation: x-pulse 0.8s infinite alternate;
}
@keyframes x-pulse {
  to {
    opacity: 0.3;
  }
}
.x-toast {
  position: absolute;
  left: 50%;
  top: 72px;
  z-index: 90;
  transform: translate(-50%, -8px);
  opacity: 0;
  pointer-events: none;
  max-width: calc(100% - 32px);
  padding: 9px 14px;
  border-radius: 10px;
  background: #18181b;
  color: #fff;
  font-size: 13px;
  box-shadow: var(--x-shadow-float);
  transition:
    opacity 0.2s,
    transform 0.2s;
}
.x-toast.is-show {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ===================================================================
   首页
   =================================================================== */
.x-home {
  height: 100%;
  overflow: auto;
}
.x-nav {
  position: sticky;
  top: 0;
  z-index: 10;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  height: 64px;
  padding: 0 28px;
  background: rgb(247 247 248 / 0.82);
  backdrop-filter: blur(14px) saturate(1.4);
}
.x-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 650;
  font-size: 15.5px;
  letter-spacing: -0.01em;
}
.x-tabs {
  display: flex;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: rgb(0 0 0 / 0.04);
}
.x-tabs a {
  padding: 5px 16px;
  border-radius: 999px;
  color: var(--x-text-3);
  text-decoration: none;
  font-weight: 500;
  font-size: 13.5px;
}
.x-tabs a.is-on {
  background: var(--x-surface);
  color: var(--x-text);
  box-shadow: var(--x-shadow-card);
}
.x-nav-right {
  justify-self: end;
  display: flex;
  align-items: center;
  gap: 8px;
}
.x-sync {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-right: 4px;
  color: var(--x-text-3);
  font-size: 12.5px;
}
.x-avatar {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: #e4e4e7;
  color: var(--x-text-2);
  font-size: 12px;
  font-weight: 600;
}
.x-home-main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 44px 32px 40px;
}
.x-home-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 36px;
}
.x-home-head h1 {
  margin: 0;
  font-size: 44px;
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.035em;
}
.x-home-head p {
  margin: 10px 0 0;
  color: var(--x-text-3);
}
.x-home-actions {
  display: flex;
  gap: 8px;
}
.x-search {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 12px;
  border-radius: 10px;
  background: var(--x-surface);
  box-shadow: var(--x-shadow-card);
  color: var(--x-text-4);
}
.x-search input {
  width: 160px;
  border: 0;
  outline: 0;
  background: none;
  font: inherit;
  color: var(--x-text);
}
.x-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(196px, 1fr));
  gap: 36px 24px;
}
.x-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  outline: none;
}
.x-thumb {
  position: relative;
  overflow: hidden;
  aspect-ratio: 210 / 297;
  border-radius: 10px;
  background: #fff;
  box-shadow: var(--x-shadow-card);
  transition:
    transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1),
    box-shadow 0.25s;
}
.x-card:hover .x-thumb,
.x-card:focus-visible .x-thumb {
  transform: translateY(-4px);
  box-shadow: var(--x-shadow-float);
}
.x-card-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.x-card-info strong {
  font-weight: 600;
  font-size: 14px;
}
.x-card-info span {
  color: var(--x-text-3);
  font-size: 12.5px;
}
.x-new {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  align-self: start;
  width: 100%;
  aspect-ratio: 210 / 297;
  border: 0;
  border-radius: 10px;
  background: rgb(0 0 0 / 0.035);
  color: var(--x-text-3);
  transition: background 0.15s;
}
.x-new:hover {
  background: rgb(0 0 0 / 0.06);
}
.x-new strong {
  color: var(--x-text);
  font-weight: 600;
}
.x-new small {
  font-size: 12.5px;
}
.x-new-plus {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-bottom: 10px;
  border-radius: 50%;
  background: var(--x-surface);
  box-shadow: var(--x-shadow-card);
  color: var(--x-text);
  transition: transform 0.2s;
}
.x-new:hover .x-new-plus {
  transform: scale(1.06);
}
.x-tpl-sec {
  margin-top: 72px;
}
.x-sec-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 20px;
}
.x-sec-head h2 {
  margin: 0;
  font-size: 18px;
  font-weight: 650;
  letter-spacing: -0.015em;
}
.x-sec-head a {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--x-text-3);
  text-decoration: none;
  font-size: 13px;
}
.x-sec-head a:hover {
  color: var(--x-text);
}
.x-tpl-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 24px;
}
.x-tpl .x-thumb {
  aspect-ratio: 4 / 3;
}
.x-foot {
  margin-top: 80px;
  text-align: center;
  color: var(--x-text-4);
  font-size: 12.5px;
}

/* ===================================================================
   编辑器
   =================================================================== */
.x-ed {
  position: relative;
  height: 100%;
  overflow: hidden;
  background: var(--x-desk);
}
.x-top {
  position: absolute;
  inset: 0 0 auto 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 60px;
  padding: 0 14px;
  background: linear-gradient(var(--x-desk) 55%, rgb(241 241 243 / 0));
}
.x-top-left,
.x-top-right {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.x-top-right {
  position: relative;
}
.x-docname {
  width: 240px;
  min-width: 0;
  height: 34px;
  padding: 0 8px;
  border: 0;
  border-radius: 8px;
  background: none;
  font: inherit;
  font-weight: 600;
  font-size: 14.5px;
  color: var(--x-text);
  outline: none;
  text-overflow: ellipsis;
}
.x-docname:hover {
  background: var(--x-hover);
}
.x-docname:focus {
  background: var(--x-surface);
  box-shadow: var(--x-shadow-card);
}
.x-saved {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--x-text-3);
  font-size: 12.5px;
  white-space: nowrap;
}
.x-saved .i {
  color: var(--x-ok);
}
.x-menu {
  position: absolute;
  top: 44px;
  z-index: 40;
  width: 280px;
  padding: 6px;
  border-radius: 14px;
  background: var(--x-surface);
  box-shadow: var(--x-shadow-float);
  animation: x-pop 0.14s ease-out;
}
.x-menu.is-right {
  right: 0;
}
.x-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  height: 38px;
  padding: 0 10px;
  border: 0;
  border-radius: 9px;
  background: none;
  text-align: left;
  color: var(--x-text-2);
}
.x-menu-item span {
  color: var(--x-text);
  font-weight: 500;
}
.x-menu-item small {
  margin-left: auto;
  color: var(--x-text-4);
  font-size: 12px;
}
.x-menu-item:hover {
  background: var(--x-hover);
}
.x-menu-field {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  color: var(--x-text-2);
}
.x-menu-field input {
  width: 96px;
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--x-border);
  border-radius: 7px;
  font: 12.5px ui-monospace, Menlo, monospace;
  outline: none;
}
.x-menu-field input:focus {
  border-color: var(--x-text-3);
}
.x-menu-sep {
  height: 1px;
  margin: 6px 4px;
  background: var(--x-border);
}
@keyframes x-pop {
  from {
    opacity: 0;
    transform: translateY(-4px) scale(0.98);
  }
}

/* 画布 */
.x-canvas {
  position: absolute;
  inset: 0;
  overflow: auto;
  padding: 76px 0 132px;
  scrollbar-width: thin;
}
.x-stage {
  position: relative;
}
.x-ed .sheet-wrap {
  margin: 0 auto;
}

/* 左侧大纲：纯文字，无面板 */
.x-outline {
  position: absolute;
  top: 84px;
  left: 18px;
  z-index: 10;
  width: 188px;
}
@media (max-width: 1179px) {
  .x-outline {
    display: none;
  }
}
.x-ol-label {
  padding: 0 10px 0 20px;
  margin-bottom: 6px;
  color: var(--x-text-4);
  font-size: 12px;
  font-weight: 500;
}
.x-ol {
  list-style: none;
  margin: 0;
  padding: 0;
}
.x-ol-item {
  display: flex;
  align-items: center;
  height: 32px;
  border-radius: 8px;
}
.x-ol-item:hover {
  background: var(--x-hover);
}
.x-ol-grip {
  display: grid;
  place-items: center;
  width: 20px;
  color: var(--x-text-4);
  opacity: 0;
  cursor: grab;
}
.x-ol-item:hover .x-ol-grip {
  opacity: 1;
}
.x-ol-name {
  flex: 1;
  min-width: 0;
  height: 100%;
  padding: 0 2px;
  border: 0;
  background: none;
  text-align: left;
  color: var(--x-text-2);
  font-size: 13.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.x-ol-item:hover .x-ol-name {
  color: var(--x-text);
}
.x-ol-dot {
  width: 6px;
  height: 6px;
  margin: 0 6px;
  border-radius: 50%;
  background: var(--x-warn);
}
.x-ol-eye {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-right: 3px;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--x-text-4);
  opacity: 0;
}
.x-ol-item:hover .x-ol-eye,
.x-ol-item.is-hidden .x-ol-eye {
  opacity: 1;
}
.x-ol-eye:hover {
  color: var(--x-text);
}
.x-ol-item.is-hidden .x-ol-name {
  color: var(--x-text-4);
  text-decoration: line-through;
}
.x-ol-item.is-dragging {
  opacity: 0.4;
}
.x-ol-item.is-drop {
  box-shadow: inset 0 0 0 1px var(--x-border-2);
}
.x-ol-add {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  margin-top: 6px;
  padding: 0 10px 0 20px;
  border: 0;
  border-radius: 8px;
  background: none;
  color: var(--x-text-3);
  font-size: 13px;
}
.x-ol-add:hover {
  background: var(--x-hover);
  color: var(--x-text);
}

/* ---------- 纸面编辑 ---------- */
.is-editable .ef {
  outline: none;
  border-radius: 3px;
  transition: background 0.12s;
  cursor: text;
}
.is-editable span.ef {
  display: inline-block;
  min-width: 0.6em;
}
.is-editable .ef:hover {
  background: rgb(0 0 0 / 0.035);
}
.is-editable .ef:focus {
  background: rgb(37 99 235 / 0.07);
}
.is-editable .ef:empty::before {
  content: attr(data-ph);
  color: #b4b4bc;
  font-weight: 400;
}
.tpl-banner.is-editable .rs-head .ef:empty::before {
  color: rgb(255 255 255 / 0.45);
}
.tpl-banner.is-editable .rs-head .ef:hover {
  background: rgb(255 255 255 / 0.1);
}
.is-editable .rs-section,
.is-editable .rs-entry,
.is-editable .rs-head {
  position: relative;
  isolation: isolate;
}
.is-editable .rs-entry::before,
.is-editable .rs-head::before {
  content: "";
  position: absolute;
  inset: -6px -10px;
  z-index: -1;
  border-radius: 8px;
  background: transparent;
  pointer-events: none;
  transition: background 0.2s;
}
.is-editable.tpl-banner .rs-head::before {
  display: none;
}
.is-editable .rs-entry:hover::before,
.is-editable .rs-entry.is-focus-within::before {
  background: rgb(0 0 0 / 0.022);
}
.is-editable .rs-entry.is-noted::before {
  background: rgb(224 138 0 / 0.09);
}

  // ------------------------------------------------------------ sheet / measure / notes
  function renderSheet() {
    const sheet = $('#sheet')
    if (!sheet) return
    const fluid = isMobile() && !state.preview
    sheet.classList.toggle('is-fluid', fluid)
    sheet.innerHTML = renderResume(state.doc, state.design, { editable: !state.preview, fluid })
    measure()
  }

  function measure() {
    const sheet = $('#sheet')
    if (!sheet) return
    const page = sheet.querySelector('.rs-page')
    if (!page) return
    sheet.querySelectorAll('.page-break').forEach((el) => el.remove())
    const fluid = page.classList.contains('is-fluid')
    const wrap = $('#sheet-wrap')
    const canvas = $('#canvas')
    let h
    if (fluid) {
      // 手机编辑：用离屏 A4 估算页数
      const probe = document.createElement('div')
      probe.style.cssText = 'position:absolute;left:-9999px;top:0;width:794px;visibility:hidden'
      probe.innerHTML = renderResume(state.doc, state.design)
      document.body.appendChild(probe)
      h = probe.firstElementChild.scrollHeight
      probe.remove()
      sheet.style.transform = ''
      wrap.style.width = ''
      wrap.style.height = ''
    } else {
      page.style.minHeight = '0px'
      h = page.scrollHeight
    }
    state.pages = Math.max(1, Math.ceil((h - 1) / A4_H))
    const rowH = state.design.fontSize * state.design.lineHeight
    state.overflowRows = h > A4_H ? Math.ceil((h - A4_H) / rowH) : 0
    state.spareRows = h <= A4_H ? Math.floor((A4_H - h) / rowH) : 0
    if (!fluid) {
      page.style.minHeight = `${state.pages * A4_H}px`
      for (let i = 1; i < state.pages; i++) {
        const line = document.createElement('div')
        line.className = 'page-break'
        line.style.top = `${i * A4_H}px`
        line.innerHTML = `<span>第 ${i} 页结束</span>`
        sheet.appendChild(line)
      }
      const cw = canvas.clientWidth
      const z = isMobile()
        ? (cw - 24) / A4_W
        : Math.max(0.55, Math.min(1.08, cw >= 1180 ? (cw - 620) / A4_W : (cw - 96) / A4_W))
      state.zoom = z
      sheet.style.transform = `scale(${z})`
      wrap.style.width = `${A4_W * z}px`
      wrap.style.height = `${state.pages * A4_H * z}px`
    }
    renderFit()
    scheduleNotes()
  }

  function renderFit() {
    const tipsN = allTips().length
    const fit = $('#fit')
    if (fit)
      fit.innerHTML = state.overflowRows
        ? `<span class="x-fit-over">${icon('file', 14)}超出 ${state.overflowRows} 行</span><button type="button" class="x-fit-go" data-action="fit">${icon('wand', 13)}适配</button>`
        : `<span class="x-fit-ok">${icon('check', 14)}${state.pages} 页 · 余 ${state.spareRows} 行</span>`
    const ms = $('#mstatus')
    if (ms)
      ms.innerHTML = `${
        state.overflowRows
          ? `<span class="x-fit-over">超出一页 ${state.overflowRows} 行</span><button type="button" class="x-fit-go" data-action="fit">${icon('wand', 13)}适配</button>`
          : `<span class="x-fit-ok">${icon('check', 13)}刚好一页</span>`
      }<span class="x-sb-spacer"></span><button type="button" class="x-mnotes" data-pop="notes">${icon('message', 14)}建议 ${tipsN}</button>`
  }

  let notesRaf = 0
  function scheduleNotes() {
    cancelAnimationFrame(notesRaf)
    notesRaf = requestAnimationFrame(renderNotes)
  }
  function notesRoom() {
    const canvas = $('#canvas')
    const wrap = $('#sheet-wrap')
    if (!canvas || !wrap || isMobile() || state.preview) return false
    return (canvas.clientWidth - wrap.offsetWidth) / 2 >= 268
  }
  function renderNotes() {
    const rail = $('#notes')
    const dock = $('#dock')
    if (!rail) return
    const room = notesRoom()
    dock?.classList.toggle('has-notes-rail', room)
    if (!room) {
      rail.innerHTML = ''
      return
    }
    const sheet = $('#sheet')
    const wrap = $('#sheet-wrap')
    const base = sheet.getBoundingClientRect().top
    rail.style.left = `${wrap.offsetLeft + wrap.offsetWidth + 28}px`
    const tips = allTips()
    const byEntry = new Map()
    for (const t of tips) {
      const k = `${t.sid}:${t.i}`
      if (!byEntry.has(k)) byEntry.set(k, [])
      byEntry.get(k).push(t)
    }
    rail.innerHTML = [...byEntry.entries()]
      .map(([k, ts]) => {
        const [sid, i] = k.split(':')
        const it = section(sid).items[Number(i)]
        return `<div class="x-note" data-note="${k}">
          <div class="x-note-head"><span class="x-note-avatar">${icon('sparkles', 12)}</span><strong>${esc(it.title || '未命名')}</strong></div>
          ${ts.map((t) => `<div class="x-note-row"><p>${esc(t.text)}</p><button type="button" class="x-icon is-sm" data-dismiss="${t.key}" title="忽略">${icon('check', 13)}</button></div>`).join('')}
        </div>`
      })
      .join('')
    let lastBottom = 0
    rail.querySelectorAll('.x-note').forEach((note) => {
      const anchor = sheet.querySelector(`[data-anchor="${note.dataset.note}"]`)
      if (!anchor) return
      const y = anchor.getBoundingClientRect().top - base
      const top = Math.max(y, lastBottom + 10)
      note.style.top = `${top}px`
      lastBottom = top + note.offsetHeight
    })
  }

  // ------------------------------------------------------------ render root
  function render() {
    app.className = `app x-app device-${state.device}`
    stage.classList.toggle('is-mobile', state.device === 'mobile')
    app.innerHTML = (state.view === 'home' ? renderHome() : renderEditor()) + '<div class="x-toast" id="toast" role="status"></div>'
    syncProtoBar()

  function scaleThumbs(root = app) {
    root.querySelectorAll('.js-scale').forEach((el) => {
      const w = el.parentElement.clientWidth

    })
  }
  function refreshChrome() {
    const ol = $('#outline')
    if (ol) ol.innerHTML = renderOutline()
    const dock = $('#dock')
    if (dock) {
      const room = dock.classList.contains('has-notes-rail')
      dock.outerHTML = renderDock()
      $('#dock')?.classList.toggle('has-notes-rail', room)
    }
    const bar = $('.x-mbar')
    if (bar) bar.outerHTML = renderMobileBar()
    refreshPop()
    renderFit()
  }
  function refreshPop() {
    const layer = $('#pop-layer')
    if (!layer) return
    layer.innerHTML = renderPop()
    requestAnimationFrame(() => scaleThumbs(layer))
    app.querySelectorAll('[data-pop]').forEach((b) => b.classList.toggle('is-on', b.dataset.pop === state.pop))
  }
  function refreshMenu() {
    const right = $('.x-top-right')
    if (!right) return
    right.querySelector('.x-menu')?.remove()
    right.insertAdjacentHTML('beforeend', renderMenu())
  }

  // ------------------------------------------------------------ history
  let saveTimer
  let commitTimer
  function dirty(immediate = false) {
    const s = $('#saved')
    if (s) s.innerHTML = '<i class="x-dot is-busy"></i><span>保存中</span>'
    clearTimeout(saveTimer)
    saveTimer = setTimeout(() => {
      const s2 = $('#saved')
      if (s2) s2.innerHTML = `${icon('check', 13)}<span>已保存</span>`
    }, 650)
    clearTimeout(commitTimer)
    const commit = () => {
      const snap = JSON.stringify({ doc: state.doc, design: state.design })
      if (snap === lastSnap) return
      undoStack.push(lastSnap)
      redoStack.length = 0
      lastSnap = snap
      app.querySelectorAll('[data-action="undo"]').forEach((b) => (b.disabled = false))
      app.querySelectorAll('[data-action="redo"]').forEach((b) => (b.disabled = true))
    }
    if (immediate) commit()
    else commitTimer = setTimeout(commit, 500)
  }
  function restore(snap) {
    const s = JSON.parse(snap)
    state.doc = s.doc
    state.design = s.design
    lastSnap = snap
    renderSheet()
    refreshChrome()
  }

  // ------------------------------------------------------------ caret helpers
  function caretOffset(el) {
    const sel = getSelection()
    if (!sel.rangeCount) return 0
    const r = sel.getRangeAt(0)
    const pre = r.cloneRange()
    pre.selectNodeContents(el)
    pre.setEnd(r.startContainer, r.startOffset)
    return pre.toString().length
  }
  function placeCaret(el, offset) {
    el.focus()
    const sel = getSelection()
    const r = document.createRange()
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT)
    let rem = offset
    let placed = false
    let n = walker.nextNode()
    while (n) {
      if (rem <= n.length) {
        r.setStart(n, rem)
        placed = true
        break
      }
      rem -= n.length
      n = walker.nextNode()
    }
    if (!placed) {
      r.selectNodeContents(el)
      r.collapse(false)
    } else r.collapse(true)
    sel.removeAllRanges()
    sel.addRange(r)
  }
  function rerenderList(ul, focusLine, offset) {
    const path = ul.dataset.list
    ul.outerHTML = list(path, getPath(path), true)
    const fresh = $(`#sheet [data-list="${path}"]`)
    const li = fresh?.querySelector(`[data-line="${focusLine}"]`)
    if (li) {
      li.textContent = rawLines(getPath(path))[focusLine] ?? ''
      placeCaret(li, offset)
    }
  }

  // ------------------------------------------------------------ actions
  function go(view) {
    state.view = view
    state.pop = null
    state.menu = null
    state.preview = false
    writeHash()
    render()
  }
  function jump(anchor) {
    const el = $(`#sheet [data-anchor="${anchor}"]`)
    if (!el) return
    el.scrollIntoView({ behavior: 'smooth', block: 'center' })
    el.classList.remove('x-flash')
    void el.offsetWidth
    el.classList.add('x-flash')
    const first = el.querySelector('.ef')
    if (first && !isMobile()) setTimeout(() => placeCaret(first, (first.textContent || '').length), 350)
  }
  function applyDesign(patch) {
    Object.assign(state.design, patch)
    dirty(true)
    renderSheet()
    refreshChrome()
  }
  function fitOnePage() {
    const d = state.design
    const before = { ...d }
    const steps = [
      () => d.lineHeight > 1.45 && (d.lineHeight = Math.round((d.lineHeight - 0.05) * 100) / 100),
      () => d.gap > 10 && (d.gap -= 2),
      () => d.margin > 32 && (d.margin -= 4),
      () => d.fontSize > 12.5 && (d.fontSize -= 0.5),
    ]
    measure()
    let guard = 0
    while (state.overflowRows > 0 && guard++ < 40) {
      if (!steps.some((s) => s())) break
      renderSheet()
    }
    dirty(true)
    refreshChrome()
    const diff = []
    if (d.lineHeight !== before.lineHeight) diff.push(`行高 ${before.lineHeight} → ${d.lineHeight}`)
    if (d.gap !== before.gap) diff.push(`间距 ${before.gap} → ${d.gap}`)
    if (d.margin !== before.margin) diff.push(`边距 ${before.margin} → ${d.margin}`)
    if (d.fontSize !== before.fontSize) diff.push(`字号 ${before.fontSize} → ${d.fontSize}`)
    toast(state.overflowRows ? '已尽量压缩，仍超出一页，建议精简内容' : `已调整到一页：${diff.join('，') || '无需调整'}　⌘Z 撤销`)
  }
  function togglePreview() {
    state.preview = !state.preview
    state.pop = null
    state.menu = null
    $('.x-ed')?.classList.toggle('is-preview', state.preview)
    refreshMenu()
    refreshChrome()
    renderSheet()
  }
  let toastTimer
  function toast(text) {
    const el = $('#toast')
    if (!el) return
    el.textContent = text
    el.classList.add('is-show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => el.classList.remove('is-show'), 2600)
  }

  // ------------------------------------------------------------ events
  app.addEventListener('mousedown', (e) => {
    // 保持编辑焦点：点工具按钮不抢焦点
    if (e.target.closest('.x-entry-tools, .x-sec-tools')) e.preventDefault()
  })

  app.addEventListener('click', (e) => {
    const t = e.target.closest(
      '[data-go],[data-act],[data-jump],[data-pop],[data-menu],[data-action],[data-template],[data-accent],[data-font],[data-dismiss],[data-toast]'
    )
    // 点外部关闭浮层
    if (!e.target.closest('.x-pop, .x-menu, [data-pop], [data-menu]')) {
      let changed = false
      if (state.pop) {
        state.pop = null
        refreshPop()
        changed = true
      }
      if (state.menu) {
        state.menu = null
        refreshMenu()
        changed = true
      }
      if (changed && !t) return
    }
    if (!t) return
    if (t.tagName === 'A') e.preventDefault()
    const ds = t.dataset

    if (ds.go) return go(ds.go)
    if (ds.jump) {
      if (state.pop === 'notes' && isMobile()) {
        state.pop = null
        refreshPop()
      }
      return jump(ds.jump)
    }
    if (ds.pop) {
      state.pop = state.pop === ds.pop ? null : ds.pop
      state.menu = null
      refreshMenu()
      return refreshPop()
    }
    if (ds.menu) {
      state.menu = state.menu === ds.menu ? null : ds.menu
      state.pop = null
      refreshPop()
      return refreshMenu()
    }
    if (ds.template) return applyDesign({ template: ds.template })
    if (ds.accent) return applyDesign({ accent: ds.accent })
    if (ds.font) return applyDesign({ font: ds.font })
    if (ds.dismiss) {
      state.dismissed.add(ds.dismiss)
      refreshChrome()
      return scheduleNotes()
    }
    if (ds.act) {
      const s = section(ds.sid)
      const i = Number(ds.i)
      const blank = { title: '', subtitle: '', date: '', tags: '', details: '' }
      let focus = null
      switch (ds.act) {
        case 'add':
          s.items.push(blank)
          focus = `${s.id}:${s.items.length - 1}`
          break
        case 'insert':
          s.items.splice(i + 1, 0, blank)
          focus = `${s.id}:${i + 1}`
          break
        case 'up':
          if (i > 0) [s.items[i - 1], s.items[i]] = [s.items[i], s.items[i - 1]]
          break
        case 'down':
          if (i < s.items.length - 1) [s.items[i + 1], s.items[i]] = [s.items[i], s.items[i + 1]]
          break
        case 'del':
          s.items.splice(i, 1)
          toast('已删除，⌘Z 撤销')
          break
        case 'hide':
          s.visible = false
          toast(`已隐藏「${s.title}」，可在左侧大纲恢复`)
          break
        case 'toggle':
          s.visible = !s.visible
          break
      }
      dirty(true)
      renderSheet()
      refreshChrome()
      if (focus) {
        const el = $(`#sheet [data-anchor="${focus}"] .ef`)
        if (el) placeCaret(el, 0)
      }
      return
    }
    if (ds.action) {
      switch (ds.action) {
        case 'undo':
          if (undoStack.length) {
            redoStack.push(lastSnap)
            restore(undoStack.pop())
            toast('已撤销')
          }
          return
        case 'redo':
          if (redoStack.length) {
            undoStack.push(lastSnap)
            restore(redoStack.pop())
          }
          return
        case 'fit':
          return fitOnePage()
        case 'preview':
          return togglePreview()
      }
    }
    if (ds.toast) {
      state.menu = null
      refreshMenu()
      return toast(ds.toast)
    }
  })

  // 纸面编辑
  app.addEventListener('input', (e) => {
    const t = e.target
    if (t.dataset.meta) {
      state.doc[t.dataset.meta] = t.value
      return dirty()
    }
    if (t.dataset.design) {
      const k = t.dataset.design
      state.design[k] = k === 'accent' ? t.value : Number(t.value)
      const out = $(`#out-${k}`)
      if (out) out.textContent = fmt(k, state.design[k])
      dirty()
      renderSheet()
      return
    }
    if (t.dataset.path) {
      setPath(t.dataset.path, t.textContent.replace(/\n/g, ' '))
      if (/^sec\.[^.]+\.title$/.test(t.dataset.path)) {
        const ol = $('#outline')
        if (ol) ol.innerHTML = renderOutline()
      }
      dirty()
      measure()
      return
    }
    const ul = t.closest('[data-list]')
    if (ul && t.dataset.line !== undefined) {
      const path = ul.dataset.list
      const arr = rawLines(getPath(path))
      if (!arr.length) arr.push('')
      arr[Number(t.dataset.line)] = t.textContent
      setPath(path, joinLines(arr))
      dirty()
      measure()
      const ol = $('#outline')
      if (ol) ol.innerHTML = renderOutline()
      const dock = $('#dock')
      if (dock) {
        const b = dock.querySelector('.x-notes-btn b')
        const n = allTips().length
        if (b) b.textContent = n
      }
    }
  })
  app.addEventListener('change', (e) => {
    if (e.target.dataset.design === 'accent') refreshChrome()
  })

  app.addEventListener('focusin', (e) => {
    const li = e.target.closest?.('[data-list] [data-line]')
    if (li) {
      const raw = rawLines(getPath(li.parentElement.dataset.list))[Number(li.dataset.line)] ?? ''
      if (li.textContent !== raw) li.textContent = raw
    }
    const ent = e.target.closest?.('[data-anchor]')
    app.querySelectorAll('.is-focus-within').forEach((el) => el.classList.remove('is-focus-within'))
    if (ent && e.target.classList.contains('ef')) ent.classList.add('is-focus-within')
  })
  app.addEventListener('focusout', (e) => {
    const li = e.target.closest?.('[data-list] [data-line]')
    if (li) {
      const ul = li.parentElement
      const raw = rawLines(getPath(ul.dataset.list))[Number(li.dataset.line)] ?? ''
      if (raw.includes('\n')) return rerenderList(ul, -1, 0)
      li.innerHTML = inline(raw)
    }
    if (e.target.dataset?.path?.endsWith('.tags')) scheduleNotes()
  })

  app.addEventListener('keydown', (e) => {
    const t = e.target
    if (t.dataset?.path && e.key === 'Enter') {
      e.preventDefault()
      return
    }
    const li = t.closest?.('[data-list] [data-line]')
    if (!li || e.isComposing) return
    const ul = li.parentElement
    const path = ul.dataset.list
    const k = Number(li.dataset.line)
    const arr = rawLines(getPath(path))
    if (!arr.length) arr.push('')
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault()
      const text = li.textContent
      const off = caretOffset(li)
      arr[k] = text.slice(0, off)
      arr.splice(k + 1, 0, text.slice(off))
      setPath(path, joinLines(arr))
      dirty(true)
      rerenderList(ul, k + 1, 0)
      measure()
    } else if (e.key === 'Backspace' && caretOffset(li) === 0 && getSelection().isCollapsed && k > 0) {
      e.preventDefault()
      const prevLen = arr[k - 1].length
      arr[k - 1] += li.textContent
      arr.splice(k, 1)
      setPath(path, joinLines(arr))
      dirty(true)
      rerenderList(ul, k - 1, prevLen)
      measure()
    } else if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.shiftKey) {
      const target = ul.querySelector(`[data-line="${k + (e.key === 'ArrowUp' ? -1 : 1)}"]`)
      if (target) {
        e.preventDefault()
        placeCaret(target, Math.min(caretOffset(li), (rawLines(getPath(path))[Number(target.dataset.line)] || '').length))
      }
    }
  })

  // 高亮：悬停批注 ↔ 经历
  app.addEventListener('mouseover', (e) => {
    const note = e.target.closest?.('.x-note')
    app.querySelectorAll('.is-noted').forEach((el) => el.classList.remove('is-noted'))
    if (note) $(`#sheet [data-anchor="${note.dataset.note}"]`)?.classList.add('is-noted')
  })

  // 大纲拖拽排序
  let dragId = null
  app.addEventListener('dragstart', (e) => {
    const li = e.target.closest?.('[data-drag]')
    if (!li) return
    dragId = li.dataset.drag
    li.classList.add('is-dragging')
    e.dataTransfer.effectAllowed = 'move'
  })
  app.addEventListener('dragover', (e) => {
    const li = e.target.closest?.('[data-drag]')
    if (!li || !dragId) return
    e.preventDefault()
    app.querySelectorAll('.is-drop').forEach((el) => el.classList.remove('is-drop'))
    li.classList.add('is-drop')
  })
  app.addEventListener('drop', (e) => {
    const li = e.target.closest?.('[data-drag]')
    if (!li || !dragId) return
    e.preventDefault()
    const arr = state.doc.sections
    const from = arr.findIndex((s) => s.id === dragId)
    const to = arr.findIndex((s) => s.id === li.dataset.drag)
    if (from > -1 && to > -1 && from !== to) {
      arr.splice(to, 0, arr.splice(from, 1)[0])
      dirty(true)
      renderSheet()
    }
    dragId = null
    refreshChrome()
  })
  app.addEventListener('dragend', () => {
    dragId = null
    const ol = $('#outline')
    if (ol) ol.innerHTML = renderOutline()
  })

  window.addEventListener('keydown', (e) => {
    const mod = e.metaKey || e.ctrlKey
    if (e.key === 'Escape') {
      if (state.preview) return togglePreview()
      if (state.pop || state.menu) {
        state.pop = null
        state.menu = null
        refreshPop()
        refreshMenu()
      }
    } else if (mod && e.key.toLowerCase() === 'z' && state.view === 'editor') {
      const inEditable = document.activeElement?.isContentEditable || /INPUT|TEXTAREA/.test(document.activeElement?.tagName)
      if (inEditable) {
        // 纸面上的撤销走全局历史，保证结构化数据一致
        e.preventDefault()
        document.activeElement.blur()
      } else e.preventDefault()
      app.querySelector(`[data-action="${e.shiftKey ? 'redo' : 'undo'}"]`)?.click()
    }
  })

  let resizeT
  window.addEventListener('resize', () => {
    clearTimeout(resizeT)
    resizeT = setTimeout(() => {
      scaleThumbs()
      if (state.view === 'editor') measure()
    }, 80)
  })

  // ------------------------------------------------------------ prototype bar
  function writeHash() {
    const p = new URLSearchParams()
    p.set('view', state.view)
    if (state.device === 'mobile' && !realPhone) p.set('device', 'mobile')
    history.replaceState(null, '', `#${p}`)
    document.querySelectorAll('[data-pb-link]').forEach((a) => {
      a.href = `${a.dataset.pbLink}#${p}`
    })
  }
  function syncProtoBar() {
    document.querySelectorAll('[data-pb-view]').forEach((b) => b.classList.toggle('is-on', b.dataset.pbView === state.view))
    document.querySelectorAll('[data-pb-device]').forEach((b) => b.classList.toggle('is-on', b.dataset.pbDevice === state.device))
  }
  document.querySelector('.proto-bar')?.addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    if (b.dataset.pbView) go(b.dataset.pbView)
    if (b.dataset.pbDevice) {
      state.device = b.dataset.pbDevice
      state.preview = false
      state.pop = null
      writeHash()
      render()
    }
  })

  writeHash()
  render()
})()

</script>
</body>
</html>
